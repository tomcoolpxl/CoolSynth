name: Release

# A version tag builds, tests and packages CoolSynth for Windows (x64) and macOS (Apple silicon, D234), then publishes
# both on one GitHub release.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-assets:
    runs-on: windows-2022
    env:
      COOLSYNTH_RUNNER_IMAGE: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build and test
        shell: pwsh
        run: ./scripts/ci/BuildAndTest.ps1 -Configuration Release -RunTests $true

      # The runner images do not promise Inno Setup: a pinned version from Chocolatey (6.5 or newer is needed for the
      # instrument downloads; D209).
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Package release artefacts
        shell: pwsh
        run: ./scripts/ci/PackageRelease.ps1 -Configuration Release -TagName "${{ github.ref_name }}" -Installer

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-${{ github.ref_name }}-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/ci-release/logs/**
            build/ci-release/Testing/ctest-results.xml
            build/ci-release/CoolSynth_artefacts/Release/Standalone/*.pdb

      - name: Upload package bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-${{ github.ref_name }}-packages
          if-no-files-found: error
          retention-days: 7
          path: build/ci-release/packages/**

  # The Mac: GitHub's Apple silicon runner with Xcode 27. The installer is an unsigned .pkg (D234).
  build-macos-assets:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Ninja
        shell: bash
        run: command -v ninja || brew install ninja

      - name: Build, test and package
        shell: bash
        run: ./scripts/ci/BuildAndTestMac.sh Release --package "${{ github.ref_name }}"

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-release-${{ github.ref_name }}-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/ci/logs/**
            build/ci/Testing/ctest-results.xml

      - name: Upload package bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-release-${{ github.ref_name }}-packages
          if-no-files-found: error
          retention-days: 7
          path: build/ci/packages/**

  publish-release:
    needs: [build-release-assets, build-macos-assets]
    runs-on: windows-2022
    steps:
      # The release notes, written per version in docs/releases/<tag>.md, one line per paragraph and per bullet
      # (the release page shows every line break). First: checking out clears the folder, so the package bundle
      # comes after it.
      - name: Check out the release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          sparse-checkout: docs/releases

      - name: Download package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-release-${{ github.ref_name }}-packages
          path: release-bundle

      - name: Download Mac package bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-release-${{ github.ref_name }}-packages
          path: release-bundle

      - name: Name the release
        id: title
        shell: pwsh
        run: '"name=CoolSynth $($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          name: ${{ steps.title.outputs.name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # The version's own notes; the action reads body_path first and falls back on body when the file is
          # missing. GitHub's generated notes (the changes since the last release) follow.
          body_path: docs/releases/${{ github.ref_name }}.md
          body: |
            ## Install

            Download **CoolSynth-Setup-${{ github.ref_name }}.exe** below and run it. It installs the VST3 and CLAP plugins for your music software, the standalone app, and the recorded instruments you tick, which it downloads from the [CoolSynth instrument library](https://huggingface.co/datasets/tomccargo/coolsynth-instruments) (2.6 GB for all of them).

            Windows may warn that the installer comes from an unknown publisher, because it is not code-signed: choose **More info**, then **Run anyway**.

            On a Mac with Apple silicon and macOS 13 or newer: open **CoolSynth-Setup-${{ github.ref_name }}.pkg**. It isn't signed, so macOS blocks it once: go to **System Settings > Privacy & Security** and click **Open Anyway**.

            Without the installer: the zips below hold the VST3, the CLAP and the app, and the instruments are on the [instrument library's page](https://huggingface.co/datasets/tomccargo/coolsynth-instruments).

            Setting up your keyboard, an Arturia MiniLab 3, or FL Studio: see [the guide](https://github.com/tomcoolpxl/CoolSynth#readme).
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-bundle/CoolSynth-Setup-${{ github.ref_name }}.exe
            release-bundle/CoolSynth-windows-x64-standalone-${{ github.ref_name }}.zip
            release-bundle/CoolSynth-windows-x64-vst3-${{ github.ref_name }}.zip
            release-bundle/CoolSynth-windows-x64-clap-${{ github.ref_name }}.zip
            release-bundle/CoolSynth-windows-x64-sha256-${{ github.ref_name }}.txt
            release-bundle/CoolSynth-Setup-${{ github.ref_name }}.pkg
            release-bundle/CoolSynth-macos-arm64-standalone-${{ github.ref_name }}.zip
            release-bundle/CoolSynth-macos-arm64-vst3-${{ github.ref_name }}.zip
            release-bundle/CoolSynth-macos-arm64-clap-${{ github.ref_name }}.zip
            release-bundle/CoolSynth-macos-arm64-sha256-${{ github.ref_name }}.txt
