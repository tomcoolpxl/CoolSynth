<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoolSynth 303 redesign</title>
<!-- CoolSynth 303's look, redrawn: the app as it is now (its screenshot and a drawing of it), a redesign, the panel in
     each of CoolSynth 808's four skins, and an all-silver TB-303 face with the 808's knobs and keys. Every mockup draws
     the same panel from one description, so the controls sit where the app puts them (Panel.cpp, Keyboard.cpp,
     SequencerView.cpp in CoolSynth303); only the drawing changes. The fonts are the app's own, from CoolSynth303's
     resources/fonts; 303-redesign/inline_fonts.py writes coolsynth-303-redesign.html with them inlined. -->
<style>
@font-face { font-family: 'ArchivoSC'; font-weight: 600; src: url(../../../../CoolSynth303/resources/fonts/ArchivoSemiCondensed-SemiBold.ttf); }
@font-face { font-family: 'ArchivoSC'; font-weight: 700; src: url(../../../../CoolSynth303/resources/fonts/ArchivoSemiCondensed-Bold.ttf); }
@font-face { font-family: 'ArchivoXB'; font-weight: 800; src: url(../../../../CoolSynth303/resources/fonts/Archivo-ExtraBold.ttf); }
@font-face { font-family: 'ArchivoM'; font-weight: 500; src: url(../../../../CoolSynth303/resources/fonts/Archivo-Medium.ttf); }
@font-face { font-family: 'ArchivoC'; font-weight: 600; src: url(../../../../CoolSynth303/resources/fonts/ArchivoCondensed-SemiBold.ttf); }
@font-face { font-family: 'PlexMono'; font-weight: 500; src: url(../../../../CoolSynth303/resources/fonts/IBMPlexMono-Medium.ttf); }
@font-face { font-family: 'PlexMono'; font-weight: 600; src: url(../../../../CoolSynth303/resources/fonts/IBMPlexMono-SemiBold.ttf); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0a09; overflow: hidden; font-family: 'ArchivoM', system-ui, sans-serif; }

/* The mockup's own bar, not part of any design */
#chrome { position: fixed; inset: 0 0 auto 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px;
  background: #050505; border-bottom: 1px solid #222; font: 500 12px/1 system-ui, sans-serif; color: #999; z-index: 50; }
#chrome b { color: #ddd; font-weight: 600; margin-right: 8px; white-space: nowrap; }
#chrome .tab { white-space: nowrap; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; cursor: pointer; color: #bbb; }
#chrome .tab.is { background: #e8742a; border-color: #e8742a; color: #111; }
#chrome .sp { flex: 1; }
#chrome label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#about { position: fixed; inset: auto 0 0 0; min-height: 30px; padding: 7px 16px; background: #050505; border-top: 1px solid #222;
  font: 400 12.5px/1.4 system-ui, sans-serif; color: #aaa; z-index: 50; }
#about b { color: #eee; font-weight: 600; }
#viewport { position: fixed; inset: 44px 0 30px 0; display: grid; place-items: center; }
#stage { width: 1280px; height: 800px; position: relative; flex: none; overflow: hidden; transform-origin: center center; }
#shot { position: absolute; inset: 0; width: 1280px; height: 800px; pointer-events: none; z-index: 40; opacity: 0; }

/* Shared pieces: every skin places the same elements; its class styles them */
.f { position: absolute; }
.t { position: absolute; white-space: nowrap; line-height: 1; }
.cap { position: absolute; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; cursor: pointer;
  font: 700 9.7px/1 'ArchivoSC'; letter-spacing: .08em; text-transform: uppercase; user-select: none; }
.cap .lens { display: none; }
.lamp { position: absolute; width: 5px; height: 5px; border-radius: 50%; }
.kname { position: absolute; width: 140px; text-align: center; font: 700 10.1px/1 'ArchivoSC'; letter-spacing: .08em; text-transform: uppercase; }
.krange { position: absolute; width: 16px; text-align: center; font: 500 7px/1 'PlexMono'; }
.mono { font-family: 'PlexMono'; font-weight: 500; }
.lbl { font: 700 9.7px/1 'ArchivoSC'; letter-spacing: .1em; text-transform: uppercase; }
.well { position: absolute; display: flex; align-items: center; justify-content: center; white-space: nowrap; font: 500 8.9px/1 'PlexMono'; }
.cell, .slot, .chainb { position: absolute; display: flex; align-items: center; justify-content: center; font: 500 8.2px/1 'PlexMono'; cursor: pointer; }
.slot, .chainb { font-size: 9.3px; }
.note { position: absolute; border-radius: 2px; }
.tail { position: absolute; height: 2px; }
.hint { position: absolute; font: 500 10.6px/1.3 'ArchivoM'; letter-spacing: .02em; white-space: normal; }
.title { position: absolute; left: 26px; top: 421px; width: 600px; margin-left: -300px; margin-top: -21px; text-align: center; transform: rotate(-90deg);
  font: 800 36.8px/42px 'ArchivoXB'; letter-spacing: .08em; white-space: nowrap; }
.foot { position: absolute; left: 860px; top: 780px; width: 404px; text-align: right; font: 500 9.7px/16px 'ArchivoM'; letter-spacing: .02em; }
svg { display: block; overflow: visible; }

.sk-re { background:

/* =============================== 3 to 6: CoolSynth 808's skins (its Theme.h and layout 5's CSS) =============================== */

    repeating-linear-gradient(90deg, rgba(255,255,255,var(--brushL)) 0 1px, rgba(0,0,0,var(--brushD)) 1px 3px),

function cap(S, text, x, y, w, h, kind = '', on = false) {

  if (S.lampAbove && lamped && kind !== 'tg') s += `<i class="lamp${isOn ? ' on' : ''}" style="${P(x + w / 2 - (S.tb ? 3 : 2.5), y - (S.tb ? 9 : 8))}"></i>`;
  const lens = !S.lampAbove && lamped ? '<i class="lens"></i>' : '';
  const cls = 'cap' + (isOn && (S.lampAbove ? !S.tb : true) ? ' on' : '') + (kind === 'hot' ? ' hot' : '') + (kind === 'dis' ? ' dis' : '');
  s += `<div class="${cls}" style="${P(x, y, w, h)}">${lens}<span>${text}</span></div>`;

function section(S, x, y, w, h, name) {
  if (S.plates) {

    return `<div class="plate" style="${P(x, y - 8, w, h + 8)}"><div class="band"></div></div><div class="t secname" style="${P(x + 12, y - 8 + 7)}">${no}${name.toUpperCase()}</div>`;

  let s = '', parts = '', labels = '';
  let rn = 11;
  const pad = (x, y) => `<circle class="cupad" cx="${x}" cy="${y}" r="2.2"/>`;
  // the bus: the signal from the oscillator to the delay, just under the sections
  s += `<path class="cu" d="M70,239 H1262"/>`;
  for (const [, x, w] of SECTIONS) s += pad(x + w / 2, 239);
  s += `<path class="cuflow" d="M141,239 H1163"/>`;
  // the mix line along the top, under the transport
  s += `<path class="cu" d="M60,46.5 H1264"/>`;
  for (const [, x, w] of SECTIONS) s += pad(x + 14, 46.5) + pad(x + w - 14, 46.5);
  // from under each knob's name down to the bus, a resistor on the way; where a key sits under the knob the trace
  // steps aside to a clear column (Amount, Time), and the oscillator's comes from its switch
  const aside = { Amount: 940, Time: 1062, Tuning: 141 };
  KNOBS.forEach(([name, size, cx, cy]) => {
    const r = size / 2, y0 = name === 'Tuning' ? 216 : cy + r + 26, x = aside[name] || cx;
    s += x === cx || name === 'Tuning' ? `<path class="cu" d="M${x},${y0} V239"/>` : `<path class="cu" d="M${cx},${y0} V${y0 + 5} H${x} V239"/>`;
    s += pad(cx === x || name === 'Tuning' ? x : cx, y0);
    if (name !== 'Tuning') {
      const ry = Math.max(y0 + 10, 193);
      parts += `<rect class="silkpart" x="${x - 3.5}" y="${ry}" width="7" height="16" rx="1"/>`;
      labels += `<text class="silktext" x="${x + 7}" y="${ry + 11}">R${rn}</text>`;
    }
    rn += 7;
  });
  // where the sections meet: a coupling capacitor each, on the bus
  ARROWS.forEach((x, i) => {
    parts += `<rect class="silkpart" x="${x - 7}" y="${150}" width="14" height="7" rx="1"/>`;
    labels += `<text class="silktext" x="${x - 7}" y="${146}">C${30 + i * 4}</text>`;
    s += `<path class="cu" d="M${x},${157} V${239}"/>` + pad(x, 157);
  });
  return svgAt(0, 0, 1280, 800, s + parts + labels);
}

// ------------------------------------------------------------------ the whole panel for one skin
function panel(S) {
  let h = '';
  // the board's ground
  if (S.is808) {
    h += copper();
    h += `<div class="tstrip" style="${P(55, 4, 570, 34)}"></div><div class="tstrip" style="${P(758, 4, 512, 34)}"></div>`;
    h += `<div class="glass" style="${P(60, 248, 1210, 130)}"></div><div class="glass" style="${P(60, 386, 1210, 392)}"></div>`;
    h += [[60, 236], [1258, 236]].map(([x, y]) => `<i class="screw" style="${P(x, y)}"></i>`).join('');
  } else {
    h += `<div class="f topbar" style="${P(0, 0, 1280, 42)}"></div>`;
  }
  h += `<div class="f strip" style="${P(0, 42, 52, 758)}"></div>`;
  h += `<div class="title">COOLSYNTH <b>303</b></div>`;

  // the top bar
  for (const [t, x, w, kind] of TOP_KEYS) h += cap(S, t.toUpperCase(), x, 8, w, 26, kind === 'tg' ? 'tg' : 'plain', false);
  const nameCls = S.plates ? 'lcd' : 'well';
  h += `<div class="${nameCls}" style="${P(96, 8, 210, 26)};display:flex;align-items:center;justify-content:center"><span class="namebox">Untitled&nbsp; · &nbsp;01A&nbsp; Line 1</span></div>`;
  if (S.plates || S.tb) h += `<div class="${S.plates ? 'lcd' : 'well'}" style="${P(908, 8, 108, 26)}"></div>`;
  h += `<div class="t tempo" style="${P(910, 14, 64)};text-align:right">128.0</div><div class="t lbl bpm" style="${P(978, 17)}">BPM</div>`;
  h += `<div class="t dsp" style="${P(764, 18, 64)};text-align:right">DSP 1%</div>`;

  // the synth's sections
  for (const [name, x, w] of SECTIONS) h += section(S, x, SEC_Y, w, SEC_H, name);
  if (S.plates) {
    // the signal path printed through the plates' heads: from each name on to the next plate, an arrow in the gap
    SECTIONS.forEach(([name, x, w], i) => {
      const start = x + 12 + 16 + textWidth(name.toUpperCase(), "800 9.6px ArchivoXB") + name.length * 1.92 + 6;
      const next = SECTIONS[i + 1];
      const end = next ? next[1] - 8 : x + w - 12;
      h += `<div class="flow" style="${P(start, 64, end - start)}"></div>`;
      if (next) h += `<div class="flowhead" style="${P(end, 61)}"></div>`;
    });
  }
  for (const x of ARROWS) h += `<div class="t arrow" style="${P(x - 5, 141)}">▸</div>`;
  for (const [name, size, cx, cy, v, o] of KNOBS) h += knobAt(S, name, size, cx, cy, v, { ...(o || {}), accent: S.is808 && o && o.accent });

  // the waveform
  if (S.waveform === 'keys') h += cap(S, 'SAW', 82, 190, 46, 24, 'on') + cap(S, 'SQUARE', 134, 190, 63, 24);
  else if (S.waveform === 'switch') h += waveSwitch(S, 141, 202);
  else h += waveSegment(141, 202);
  h += cap(S, 'ON', 882, 190, 40, 24, 'on') + cap(S, 'ON', 1070, 190, 40, 24, 'on');
  h += `<div class="t val" style="${P(1118, 198)}">1/8</div>`;
  h += S.fader(1167, 80, .35) + S.fader(1221, 80, .21);
  h += `<div class="kname" style="${P(1167 - 70, 199)}">FEEDBACK</div><div class="kname" style="${P(1221 - 70, 199)}">MIX</div>`;

  // the keyboard
  if (S.is808) h += `<div class="t glassname" style="${P(74, 257)}">KEYBOARD</div>`;
  else h += section(S, 60, 254, 1210, 122, 'Keyboard');
  for (const [t, x, y, w, kind] of KB_KEYS) h += cap(S, t.toUpperCase(), x, y, w, 24, kind === 'plain' ? 'plain' : kind === 'on' ? 'on' : '');
  h += piano(S);
  h += `<div class="hint" style="${P(1102, 279, 158)}">Write: a key sets step 1's note and octave, then moves on.</div>`;

  // the sequencer
  if (S.is808) h += `<div class="t glassname" style="${P(74, 395)}">SEQUENCER · EDITING 01</div>`;
  else h += section(S, 60, 392, 1210, 384, 'Sequencer · Editing 01');
  h += sequencer(S);

  h += `<div class="foot">CoolSynth 303 · a bass line from its circuit</div>`;
  return h;
}

function waveSwitch(S, cx, cy) {
  // a slide switch lying on its side, the saw at its left: the 808's switch, and the TB-303's own WAVEFORM switch
  const id = 'sw' + uid++, tx = 7;
  const ridges = [0, 1, 2, 3].map(i => `<line y1="9" y2="19" x1="${tx + 4 + i * 2.6}" x2="${tx + 4 + i * 2.6}" stroke="rgba(0,0,0,.38)"/><line y1="9" y2="19" x1="${tx + 5 + i * 2.6}" x2="${tx + 5 + i * 2.6}" stroke="rgba(255,255,255,.45)" stroke-width=".7"/>`).join('');
  const sw = `<defs><linearGradient id="${id}p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${S.tb ? '#2a2b2d' : 'var(--sw-a)'}"/><stop offset=".5" style="stop-color:${S.tb ? '#1a1a1b' : 'var(--sw-b)'}"/><stop offset="1" style="stop-color:${S.tb ? '#0d0d0d' : 'var(--sw-c)'}"/></linearGradient>
    <linearGradient id="${id}t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${S.tb ? '#f4f4f4' : 'var(--th-a)'}"/><stop offset=".55" style="stop-color:${S.tb ? '#c9cbce' : 'var(--th-b)'}"/><stop offset="1" style="stop-color:${S.tb ? '#8f9296' : 'var(--th-c)'}"/></linearGradient></defs>
    <rect x=".5" y=".5" width="45" height="27" rx="3.5" fill="url(#${id}p)" stroke="#0b0a09"/>
    <rect x="4" y="9" width="38" height="10" rx="2" fill="#000" stroke="rgba(0,0,0,.8)"/>
    <rect x="${tx + 2}" y="6.5" width="16" height="15" rx="2.5" fill="#000" opacity=".55"/>
    <rect x="${tx}" y="6" width="16" height="16" rx="2.5" fill="url(#${id}t)" stroke="#57514a" stroke-width=".8"/>${ridges}`;
  const ink = S.tb ? '#161616' : 'var(--board-label)', dim = S.tb ? '#161616' : 'var(--board-dim)';
  let s = svgAt(cx - 23, cy - 14, 46, 28, sw, '');
  s += `<div class="t swlabel lit" style="${P(cx - 23 - 52, cy - 10, 46)};text-align:right">SAW</div>`;
  s += `<div class="t swlabel" style="${P(cx + 29, cy - 10)}">SQUARE</div>`;
  s += svgAt(cx - 23 - 26, cy + 2, 18, 9, `<path d="${wave('saw')}" fill="none" stroke="${ink}" stroke-width="1.3" transform="translate(1,0.5)"/>`);
  s += svgAt(cx + 29, cy + 2, 18, 9, `<path d="${wave('square')}" fill="none" stroke="${dim}" stroke-width="1.3" transform="translate(1,0.5)"/>`);
  return s;
}
function waveSegment(cx, cy) {
  // the redesign's: one recessed bay, two keys in it, the waveform drawn on each and the chosen one lit
  let s = `<div class="seg" style="${P(80, 186, 120, 32)}"></div>`;
  s += `<div class="cap on" style="${P(83, 189, 56, 26)}"><i class="lens"></i><svg width="22" height="11"><path d="${wave('saw', 20, 10)}" fill="none" stroke="#fff" stroke-width="1.5" transform="translate(1,.5)"/></svg></div>`;
  s += `<div class="cap" style="${P(141, 189, 56, 26)}"><i class="lens"></i><svg width="22" height="11"><path d="${wave('square', 20, 10)}" fill="none" stroke="#c9c8c3" stroke-width="1.5" transform="translate(1,.5)"/></svg></div>`;
  s += `<div class="t lbl grp" style="${P(82, 222, 56)};text-align:center;font-size:8.4px">SAW</div><div class="t lbl grp" style="${P(140, 222, 56)};text-align:center;font-size:8.4px">SQUARE</div>`;
  return s;
}

function piano(S) {
  let s = '';
  if (S.plates) s += `<div class="keybed" style="${P(PIANO_X - 6, PIANO_Y - 4, 22 * WW + 12, 88)}"></div>`;
  if (S.tb) s += `<div class="black" style="${P(PIANO_X - 8, PIANO_Y - 6, 22 * WW + 16, 102)}"></div>`;
  const isWhite = k => [0, 2, 4, 5, 7, 9, 11].includes(k % 12);
  let whites = 0, blacks = '';
  for (let k = 0; k < 37; k++) {
    if (isWhite(k)) {
      const pk = k === 24;
      s += `<div class="f wk${k % 12 === 0 ? ' c' : ''}${pk ? ' pk' : ''}" style="${P(PIANO_X + whites * WW, PIANO_Y - 4, WW, 84)}"><span class="t" style="left:0;right:0;bottom:6px;text-align:center">${LETTERS[k % 12]}</span></div>`;
      whites++;
    } else blacks += `<div class="f bk" style="${P(PIANO_X + whites * WW - 9, PIANO_Y - 4, 18, 80 * .62 + 4)}"></div>`;
  }
  s += blacks;
  for (const [name, a, n] of [['Octave down', 0, 7], ['As written', 7, 7], ['Octave up', 14, 8]]) {
    s += `<div class="f octline" style="${P(PIANO_X + a * WW + 3, 350, n * WW - 6, 1)}"></div>`;
    s += `<div class="t octname" style="${P(PIANO_X + a * WW + 3, 357, n * WW - 6)};text-align:center">${name.toUpperCase()}</div>`;
  }
  return s;
}

function sequencer(S) {
  let s = '';
  // the pattern row
  if (S.tb) s += `<div class="black" style="${P(66, 408, 1198, 38)}"></div>`;
  // only 01 holds notes (the library's Line 1); the others are empty, drawn darker as the app does
  for (let i = 0; i < 16; i++) s += `<div class="slot${i === 0 ? ' edit' : ' empty'}" style="${P(72 + i * 31 + Math.floor(i / 4) * 8, 414, 28, 26)}">${String(i + 1).padStart(2, '0')}</div>`;
  const capG = '--g:var(--cap-a)';
  s += `<div class="cell ab lit" style="${P(601, 414, 27, 26)};font:700 10px/1 ArchivoSC;${capG}">A</div><div class="cell ab" style="${P(631, 414, 27, 26)};font:700 10px/1 ArchivoSC;${capG}">B</div>`;
  if (S.lampAbove) s += `<i class="lamp" style="${P(682, 424.5)}"></i>`;
  s += `<div class="t rowname" style="${P(S.lampAbove ? 692 : 678, 423)};${S.tb ? '' : ''}">CHAIN</div>`;
  ['01×2', '02', '01×2', '03'].forEach((t, i) => s += `<div class="chainb" style="${P(744 + i * 49, 414, 46, 26)}">${t}</div>`);
  s += `<div class="cell" style="${P(940, 414, 26, 26)};font:700 12px/1 ArchivoSC;${capG}">+</div>`;
  if (S.lampAbove) s += `<div class="cell" style="${P(976, 414, 64, 26)};justify-content:flex-start;padding-left:20px;font:700 10px/1 ArchivoSC;letter-spacing:.08em;${capG}">LOOP</div><i class="lamp on" style="${P(985.5, 424.5)}"></i>`;
  else s += cap(S, 'LOOP', 976, 415, 64, 24, 'tg', true);

  // the tools
  for (const [t, x] of TOOLS.labels) s += `<div class="t lbl grp" style="${P(x, 459)}">${t.toUpperCase()}</div>`;
  for (const x of TOOLS.seps) s += `<div class="f sep" style="${P(x, 452, 1, 22)}"></div>`;
  for (const [t, x, w, kind] of TOOLS.keys) s += cap(S, t.toUpperCase(), x, 451, w, 24, kind || 'plain');
  for (const [t, x, w] of TOOLS.boxes) s += `<div class="well" style="${P(x, 451, w, 24)}">${t}</div>`;

  // the grid
  if (S.plates) s += `<div class="screen" style="${P(140, 484, 958, 278)}"></div>`;
  if (S.tb) s += `<div class="black" style="${P(68, 484, 1032, 280)}"></div>`;
  s += `<div class="t rowname" style="${P(77, 545)}">PITCH</div>`;
  s += `<div class="t rowhint" style="${P(77, 559, 64)};white-space:normal">Drag up or down, or wheel</div>`;
  for (const [r, n] of [['octave', 'OCTAVE'], ['accent', 'ACCENT'], ['slide', 'SLIDE'], ['gate', 'GATE']]) s += `<div class="t rowname" style="${P(77, ROW[r][0] + 6)}">${n}</div>`;
  s += `<div class="t rowname" style="${P(77, 720)}">MOTION</div><div class="well" style="${P(77, 736, 80, 20)}">Cutoff</div>`;
  // the notes down the lane's edge
  const [pt, pb] = ROW.pitch, rh = (pb - pt) / 13;
  for (let n = 0; n <= 12; n++) {
    const sharp = [1, 3, 6, 8, 10].includes(n), lit = n === 0;
    s += `<div class="f minikey ${lit ? 'lit' : sharp ? 'b' : 'w'}" style="${P(145, pb - (n + 1) * rh, 30, rh)};font:500 6.2px/${rh}px PlexMono;text-align:right;padding-right:3px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)">${LETTERS[n]}</div>`;
  }
  const head = -1;
  STEPS.forEach(([n, oct, gate, acc, slide], i) => {
    const x = colX(i);
    // the light and the number
    if (S.is808) s += `<i class="steplamp" style="${P(x + COLW / 2 - 12, ROW.lights - 2.5)}"></i>`;
    else s += `<i class="lamp" style="${P(x + COLW / 2 - 10.5, ROW.lights - 2.5)};opacity:.85"></i>`;
    s += `<div class="t stepno" style="${P(x + COLW / 2 - 3, ROW.lights - 4)}">${i + 1}</div>`;
    const name = gate === 'rest' ? '·' : gate === 'tie' ? 'tie' : LETTERS[n] + (oct > 0 ? '+' : oct < 0 ? '−' : '');
    s += `<div class="t notename" style="${P(x, ROW.names - 4, COLW)};text-align:center">${name}</div>`;
    // the lanes and the note
    for (let k = 0; k < 13; k++) s += `<div class="f lane${k % 2}" style="${P(x, pb - (k + 1) * rh, COLW, rh)}"></div>`;
    const prev = STEPS[i - 1];
    const sounding = gate === 'note' ? n : gate === 'tie' && prev && prev[2] !== 'rest' ? prev[0] : -1;
    if (sounding >= 0) {
      const y = pb - (sounding + 1) * rh - 1;
      const cls = gate === 'tie' ? 'tie' : acc ? 'acc' : '';
      s += `<div class="note ${cls}" style="${P(x + 3, y, COLW - 6, rh + 2)}"></div>`;
      if (slide) s += `<div class="tail" style="${P(x + COLW - 3, y + rh / 2, 10)}"></div>`;
    }
    if (i === 0) s += `<div class="f pick" style="${P(x - 2, pt - 2, COLW + 4, pb - pt + 4)}"></div>`;
    const g = 'g' + (1 + Math.floor(i / 4));
    const gv = `--g:var(--g${1 + Math.floor(i / 4)});--gon:var(--gon${1 + Math.floor(i / 4)})`;
    const dimmed = gate !== 'note';
    // octave
    const [oy0, oy1] = ROW.octave;
    s += `<div class="cell${oct ? (dimmed ? ' half' : ' lit') : ''}" style="${P(x, oy0, COLW, oy1 - oy0)};${gv}">${oct > 0 ? 'Up' : oct < 0 ? 'Down' : ''}</div>`;
    // accent
    s += `<div class="cell${acc ? ' acc' : ''}" style="${P(x, ROW.accent[0], COLW, 20)};${gv}"></div>`;
    // slide
    s += `<div class="cell${slide ? ' lit' : ''}" style="${P(x, ROW.slide[0], COLW, 20)};${gv}">${S.lampAbove && !S.tb ? `<i class="lamp${slide ? ' on' : ''}" style="position:static;${slide ? '' : 'background:#4a1c17'}"></i>` : '<i class="led"></i>'}</div>`;
    // gate
    s += `<div class="cell${gate === 'note' ? ' lit' : ' dim'}" style="${P(x, ROW.gate[0], COLW, 20)};${gv}">${gate[0].toUpperCase() + gate.slice(1)}</div>`;
    // motion
    const [my0, my1] = ROW.motion, bh = 7 + i * 16 / 15;
    s += `<div class="f mcell" style="${P(x, my0, COLW, my1 - my0)}"></div><div class="f mbar" style="${P(x + 3, my1 - 2 - bh, COLW - 6, bh)}"></div>`;
  });

  // the locks
  if (S.tb) s += `<div class="lockpanel" style="${P(1108, 486, 150, 276)}"></div>`;
  else if (S.plates) s += `<div class="screen" style="${P(1108, 484, 150, 278)}"></div>`;
  else s += svgAt(0, 0, 1280, 800, `<path class="locks" fill="${S.is808 ? '' : 'none'}" d="${framePath(1108, 486, 150, 276, S.is808 ? 4 : 9, 0, 0)}"/>`);
  s += `<div class="t rowname lockname" style="${P(1122, 499)}${S.tb ? ';color:#f2f2f0' : ''}">LOCKS · STEP 1</div>`;
  // on glass (808) or in a black box (TB-303) the locks' knobs take the dark side's ticks and light names
  const lk = S.is808 || S.tb ? { ...S, knob: (v, sz, o) => knob808(v, sz, { ...o, glass: true, metal: S.tb }) } : S;
  [['Cutoff', 1149, 547, .35], ['Env mod', 1215, 547, .55], ['Decay', 1149, 609, .45], ['Accent', 1215, 609, .7, { rim: true, accent: true }]].forEach(([n, x, y, v, o]) => {
    let k = knobAt(lk, n, 30, x, y, v, { range: false, ...(o || {}) });
    if (S.is808 || S.tb) k = k.replace(/class="kname" style="/g, `class="kname" style="color:${S.tb ? '#f2f2f0' : '#f4efe4'};`);
    s += k;
  });
  s += cap(S, 'CLEAR', 1122, 652, 122, 26, 'plain');
  s += `<div class="hint" style="${P(1122, 688, 128)}${S.tb ? ';color:#bdbdbd' : ''}">Turn a knob to hold its value on this step.</div>`;
  return s;
}

// ------------------------------------------------------------------ the page
const stage = document.getElementById('stage');
let current = location.hash.slice(1) || 'now';
function show(v) {
  current = v;
  history.replaceState(null, '', '#' + v);
  document.querySelectorAll('#chrome .tab').forEach(b => b.classList.toggle('is', b.dataset.v === v));
  document.getElementById('about').innerHTML = ABOUT[v];
  const shot = `<img id="shot" src="303-redesign/app-now.png" alt="">`;
  if (v === 'shot') { stage.className = ''; stage.removeAttribute('style'); stage.innerHTML = shot.replace('id="shot"', 'id="shot" style="opacity:1"'); fit(); return; }
  const S = SKINS[v];
  stage.className = S.cls;
  stage.removeAttribute('style');
  if (S.vars) for (const [k, val] of Object.entries(S.vars)) if (k.startsWith('--')) stage.style.setProperty(k, val);
  stage.innerHTML = panel(S) + shot;
  document.getElementById('shot').style.opacity = document.getElementById('over').value / 100;
  fit();
}
function fit() {
  const vp = document.getElementById('viewport').getBoundingClientRect();
  const k = Math.min(vp.width / 1280, vp.height / 800);
  stage.style.transform = `scale(${k})`;
}
document.querySelectorAll('#chrome .tab').forEach(b => b.onclick = () => show(b.dataset.v));
document.getElementById('over').oninput = e => { const s = document.getElementById('shot'); if (s && current !== 'shot') s.style.opacity = e.target.value / 100; };
addEventListener('resize', fit);
addEventListener('keydown', e => {
  const order = [...document.querySelectorAll('#chrome .tab')].map(b => b.dataset.v), i = order.indexOf(current);
  if (e.key === 'ArrowRight') show(order[(i + 1) % order.length]);
  if (e.key === 'ArrowLeft') show(order[(i + order.length - 1) % order.length]);
});
// ?bare: the panel alone at 1280 by 800, for screenshots
if (location.search.includes('bare')) {
  document.getElementById('chrome').style.display = document.getElementById('about').style.display = 'none';
  document.getElementById('viewport').style.inset = '0';
}
document.fonts.ready.then(() => show(current));
</script>
</body>
