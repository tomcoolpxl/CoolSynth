<!doctype html>
<html lang="en" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoolSynth 808 - vector panel mockup</title>
<style>
  /* Every colour is a named role, so a theme is only this list. */
  [data-theme="studio"] {
    --desk:#171615; --panel:#2d2b28; --ink:#ece4d2; --dim:#9a927f; --line:#4a463f;
    --strip:#e8742a; --on:#e8742a; --on-ink:#1a1512; --lit:#ffc36b;
    --g1:#4b463e; --g2:#5b554b; --g3:#6c6558; --g4:#7e7666; --grid:transparent;
  }
  [data-theme="paper"] {
    --desk:#d8d1bf; --panel:#f3ecdb; --ink:#1d1c1a; --dim:#7b7566; --line:#c9c0aa;
    --strip:#c8372d; --on:#1d1c1a; --on-ink:#f3ecdb; --lit:#c8372d;
    --g1:#e6dec9; --g2:#dbd2bb; --g3:#cfc5ac; --g4:#c3b89d; --grid:transparent;
  }
  [data-theme="night"] {
    --desk:#000000; --panel:#101012; --ink:#c9c5bb; --dim:#6d6a63; --line:#2a2a2f;
    --strip:#ffb000; --on:#ffb000; --on-ink:#141000; --lit:#ffd266;
    --g1:#1b1b1f; --g2:#232329; --g3:#2c2c33; --g4:#35353e; --grid:transparent;
  }
  [data-theme="blueprint"] {
    --desk:#0b2444; --panel:#133d70; --ink:#eaf3ff; --dim:#8fb1dc; --line:#3d6aa6;
    --strip:#eaf3ff; --on:#eaf3ff; --on-ink:#133d70; --lit:#9fe3ff;
    --g1:#1b4b87; --g2:#235799; --g3:#2b63ab; --g4:#346fbd; --grid:rgba(234,243,255,.07);
  }

  * { box-sizing:border-box; }
  html { font:13px/1.2 "Inter","Segoe UI","Helvetica Neue",Arial,sans-serif; }
  body { margin:0; background:var(--desk); color:var(--ink); transition:background .2s; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }

  /* The mockup's own bar: not part of the plugin. */
  .mock-bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:12px 16px; font-size:12px; color:var(--dim); }
  .mock-bar .themes { display:flex; gap:6px; }
  .mock-bar .themes button { padding:5px 10px; border:1px solid var(--line); border-radius:999px; color:var(--ink); }
  .mock-bar .themes button.is { background:var(--ink); color:var(--panel); border-color:var(--ink); }

  .holder { margin:0 16px 24px; }
  .plug { width:1240px; background:var(--panel); border:1px solid var(--line); border-radius:10px; transform-origin:top left;
          background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
          background-size:20px 20px; user-select:none; -webkit-user-select:none; }

  .head { display:flex; align-items:flex-end; justify-content:space-between; padding:18px 24px 12px; }
  .word { font-size:27px; font-weight:300; letter-spacing:.01em; }
  .word b { font-weight:800; letter-spacing:.03em; }
  .sub { margin-top:4px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  .views { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .views button { padding:7px 12px; color:var(--dim); }
  .views button.is { background:var(--ink); color:var(--panel); }

  .sound { display:grid; grid-template-columns:repeat(12, 1fr); padding:4px 16px 14px; }
  .col { display:flex; flex-direction:column; align-items:center; gap:9px; padding:10px 0 0; min-height:292px; border-left:1px solid var(--line); }
  .col:first-child { border-left:0; }
  .col.sel { background:color-mix(in srgb, var(--ink) 7%, transparent); }
  .code { font-size:15px; font-weight:800; letter-spacing:.08em; }

  .knob { display:flex; flex-direction:column; align-items:center; gap:2px; cursor:ns-resize; touch-action:none; }
  .knob svg { display:block; }
  .knob .lbl { height:12px; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
  .knob.drag .lbl, .knob:hover .lbl { color:var(--ink); }
  .knob .trk { stroke:var(--line); } .knob .val, .knob .ptr { stroke:var(--ink); }
  .knob.unset .val, .knob.unset .ptr { stroke:var(--dim); }
  .knob.locked .val, .knob.locked .ptr { stroke:var(--lit); }

  .pair { display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; font-size:10px; font-weight:700; letter-spacing:.06em; }
  .pair button { padding:4px 7px; color:var(--dim); }
  .pair button.is { background:var(--ink); color:var(--panel); }

  .namekey { margin-top:auto; width:calc(100% - 12px); padding:7px 2px 8px; border:1px solid var(--line); border-radius:6px;
             display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; letter-spacing:.04em; color:var(--dim); }
  .col.sel .namekey { border-color:var(--ink); color:var(--ink); }
  .led { width:6px; height:6px; border-radius:50%; background:var(--line); }
  .led.on { background:var(--lit); box-shadow:0 0 8px var(--lit); }

  .strip { height:3px; margin:0 24px; background:var(--strip); border-radius:2px; }

  .row3 { display:grid; grid-template-columns:300px 1fr 190px; align-items:end; padding:0 16px; }
  .seq { padding-top:14px; padding-bottom:6px; }
  .left { display:flex; align-items:flex-end; gap:14px; padding-right:16px; }
  .right { display:flex; flex-direction:column; gap:6px; padding-left:16px; }
  .right .r { display:flex; gap:6px; align-items:center; }
  .play { width:56px; height:56px; border:1px solid var(--ink); border-radius:8px; display:grid; place-items:center; }
  .play svg { fill:var(--ink); }
  .play.is { background:var(--on); border-color:var(--on); } .play.is svg { fill:var(--on-ink); }
  .num { display:flex; flex-direction:column; gap:2px; cursor:ns-resize; touch-action:none; }
  .num .v { font-size:22px; font-weight:300; font-variant-numeric:tabular-nums; }
  .num .lbl, .tag .lbl { font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .num.small { flex-direction:row; align-items:baseline; gap:5px; } .num.small .v { font-size:12px; font-weight:600; min-width:18px; text-align:right; }
  .num.small .lbl:empty { display:none; }
  .tag { display:flex; flex-direction:column; gap:2px; margin-left:auto; text-align:right; }
  .tag .v { font-size:13px; font-weight:700; }
  .seg { display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; font-size:10.5px; font-weight:700; }
  .seg button { padding:5px 9px; color:var(--dim); min-width:26px; }
  .seg button.is { background:var(--ink); color:var(--panel); }
  .chip { padding:5px 9px; border:1px solid var(--line); border-radius:5px; font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--dim); }
  .chip.is { background:var(--on); border-color:var(--on); color:var(--on-ink); }
  .chip.grab { cursor:grab; border-style:dashed; }

  .nums, .steps { display:grid; grid-template-columns:repeat(16, 1fr); column-gap:6px; }
  .nums span { text-align:center; font-size:10px; color:var(--dim); padding-bottom:5px; font-variant-numeric:tabular-nums; }
  .steps > :nth-child(4n):not(:last-child), .nums > :nth-child(4n):not(:last-child) { margin-right:8px; }
  .step { position:relative; height:56px; border-radius:6px; background:var(--g1); cursor:pointer; }
  .step.b2 { background:var(--g2); } .step.b3 { background:var(--g3); } .step.b4 { background:var(--g4); }
  .step.off-len { opacity:.25; }
  .step .fill { position:absolute; inset:0; display:flex; gap:2px; align-items:flex-end; border-radius:inherit; overflow:hidden; pointer-events:none; }
  .step .fill i { flex:1; background:var(--on); border-radius:inherit; }
  .step .fill i.flam { flex:0 0 4px; opacity:.75; border-radius:2px; }
  .step .ev { position:absolute; left:4px; bottom:2px; font-size:9px; font-weight:800; color:var(--on-ink); pointer-events:none; }
  .step.lock::after { content:""; position:absolute; left:2px; right:2px; bottom:-6px; height:2px; border-radius:1px; background:var(--lit); }
  .step.sel { outline:2px solid var(--ink); outline-offset:1px; }
  .step.play { outline:2px solid var(--lit); outline-offset:1px; }

  .handle { display:flex; align-items:center; gap:12px; width:100%; padding:8px 24px 10px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  .handle::before, .handle::after { content:""; flex:1; height:1px; background:var(--line); }
  .handle:hover { color:var(--ink); }

  .lanes { display:none; padding-bottom:14px; }
  .plug.open .lanes { display:block; }
  .lane { height:31px; align-items:center; }
  .lane.sel { background:color-mix(in srgb, var(--ink) 7%, transparent); }
  .lane.muted .steps { opacity:.35; }
  .lane .step { height:22px; border-radius:4px; }
  .lane .step .ev { bottom:1px; font-size:8px; }
  .lhead { display:grid; grid-template-columns:30px 76px 84px 1fr; align-items:center; gap:6px; padding-right:16px; height:100%; cursor:pointer; }
  .lhead .code { font-size:12px; display:flex; align-items:center; gap:5px; }
  .lhead .nm { font-size:10.5px; color:var(--dim); white-space:nowrap; }
  .lhead .minis { display:flex; gap:6px; }
  .lhead .ms { display:flex; gap:4px; justify-content:flex-end; }
  .ms button { width:20px; height:18px; border:1px solid var(--line); border-radius:4px; font-size:9.5px; font-weight:800; color:var(--dim); }
  .ms button.is { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  .lane .right { flex-direction:row; gap:14px; align-items:center; }

  .insp { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); align-items:center; min-height:58px; }
  .insp .who { font-size:13px; font-weight:700; } .insp .who small { display:block; margin-top:3px; font-size:10px; font-weight:400; color:var(--dim); letter-spacing:.04em; }
  .insp .ctl { display:flex; align-items:center; gap:22px; }
  .insp .grp { display:flex; align-items:center; gap:8px; }
  .insp .grp > .lbl { font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .insp .hint { padding-left:16px; font-size:10px; line-height:1.4; color:var(--dim); }
</style>
</head>
<body>

<div class="mock-bar">
  <span>Mockup 1: the vector panel with its lanes. No sound.</span>
  <span class="themes" id="themes"></span>
  <span>Drag a knob or a number up and down. Click a step to switch it; right-click selects it without switching.</span>
</div>

<div class="holder" id="holder">
  <div class="plug open" id="plug">
    <div class="head">
      <div>
        <div class="word">CoolSynth <b>808</b></div>
        <div class="sub">Eleven circuits &middot; sixteen sounds</div>
      </div>
      <div class="views">
        <button class="is">Panel</button>
        <button id="lidTab" title="Under the Lid is the next mockup">Under the Lid</button>
      </div>
    </div>

    <div class="sound" id="sound"></div>
    <div class="strip"></div>

    <div class="row3 seq">
      <div class="left">
        <button class="play" id="play" title="Start and stop"><svg width="18" height="18" viewBox="0 0 18 18"><path id="playIcon" d="M4 2 L16 9 L4 16 Z"/></svg></button>
        <div id="tempo"></div>
        <div id="shuffle"></div>
        <div class="tag"><span class="v" id="selName"></span><span class="lbl">Steps shown</span></div>
      </div>
      <div>
        <div class="nums" id="nums"></div>
        <div class="steps" id="panelSteps"></div>
      </div>
      <div class="right">
        <div class="r"><div class="seg" id="variation"></div><button class="chip" id="fill">Fill</button></div>
        <div class="r"><div id="pattern"></div><span class="chip grab" title="Drag the pattern into the DAW as MIDI">Drag MIDI</span></div>
      </div>
    </div>

    <button class="handle" id="handle">Lanes</button>

    <div class="lanes">
      <div id="laneRows"></div>
      <div class="row3 insp" id="insp"></div>
    </div>
  </div>
</div>

<script>
const INS = [
  { id:'AC', name:'Accent', knobs:['Level'] },
  { id:'BD', name:'Bass drum', knobs:['Level','Tone','Decay'] },
  { id:'SD', name:'Snare drum', knobs:['Level','Tone','Snappy'] },
  { id:'LT', alt:'LC', name:'Low tom', altName:'Low conga', knobs:['Level','Tuning'] },
  { id:'MT', alt:'MC', name:'Mid tom', altName:'Mid conga', knobs:['Level','Tuning'] },
  { id:'HT', alt:'HC', name:'High tom', altName:'High conga', knobs:['Level','Tuning'] },
  { id:'RS', alt:'CL', name:'Rim shot', altName:'Claves', knobs:['Level'] },
  { id:'CP', alt:'MA', name:'Hand clap', altName:'Maracas', knobs:['Level'] },
  { id:'CB', name:'Cowbell', knobs:['Level'] },
  { id:'CY', name:'Cymbal', knobs:['Level','Tone','Decay'] },
  { id:'OH', name:'Open hat', knobs:['Level','Decay'] },
  { id:'CH', name:'Closed hat', knobs:['Level'] },
];
const THEMES = [['studio','Studio 1982'],['paper','Paper'],['night','Night'],['blueprint','Blueprint']];
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

const state = { sel:'BD', selStep:null, playing:false, tick:-1, tempo:120, shuffle:0, variation:'A', pattern:1, fill:false, params:{}, lanes:{} };
const newStep = () => ({ on:false, chance:1, every:1, flam:false, split:1, locks:{} });
for (const ins of INS) {
  state.lanes[ins.id] = { steps:Array.from({ length:16 }, newStep), len:16, shf:0, mute:false, solo:false, alt:false };
  for (const k of ins.knobs) state.params[ins.id + '.' + k] = k === 'Level' ? 0.75 : 0.5;
}
// A demo pattern that shows every kind of mark once.
const put = (id, list) => list.forEach(n => state.lanes[id].steps[n - 1].on = true);
put('AC', [1, 9]); put('BD', [1, 5, 9, 11, 13]); put('SD', [5, 13]); put('CP', [13]); put('CB', [4, 11]);
put('OH', [3, 7, 11, 15]); put('CH', [1, 2, 4, 5, 6, 8, 9, 10, 12, 13, 14, 16]); put('LT', [15, 16]); put('RS', [7, 10, 13]);
state.lanes.SD.steps[12].flam = true;
state.lanes.CH.steps[15].split = 3;
state.lanes.CB.steps[10].chance = 0.5;
state.lanes.OH.steps[14].every = 2;
state.lanes.BD.steps[10].locks.Decay = 0.9;
state.lanes.RS.len = 12;

const views = {};                      // parameter key -> redraw functions, so the panel and the lanes stay one thing
const redraw = key => (views[key] || []).forEach(f => f());
const fmt = v => (v * 10).toFixed(1);

function drag(target, onMove, onEnd) {
  target.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault(); target.setPointerCapture(e.pointerId); target.classList.add('drag');
    let y = e.clientY;
    const move = ev => { onMove(y - ev.clientY); y = ev.clientY; };
    const up = () => { target.classList.remove('drag'); target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', up); if (onEnd) onEnd(); };
    target.addEventListener('pointermove', move); target.addEventListener('pointerup', up);
  });
}

function knob({ size, label, name, get, set, reset, cls }) {
  const k = el('div', 'knob'), r = size / 2 - 4, c = size / 2, w = size > 30 ? 3 : 2.5;
  const pt = a => [c + r * Math.sin(a), c - r * Math.cos(a)];
  const arc = (a0, a1) => { const [x0, y0] = pt(a0), [x1, y1] = pt(a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`; };
  const A0 = -0.75 * Math.PI, A1 = 0.75 * Math.PI;
  k.innerHTML = `<svg width="${size}" height="${size}" fill="none" stroke-linecap="round"><path class="trk" stroke-width="${w}" d="${arc(A0, A1)}"/><path class="val" stroke-width="${w}"/>` +
    (size > 30 ? `<line class="ptr" stroke-width="2"/>` : '') + `</svg>` + (label ? `<span class="lbl"></span>` : '');
  const val = k.querySelector('.val'), ptr = k.querySelector('.ptr'), lbl = k.querySelector('.lbl');
  const draw = () => {
    const v = get(), a = A0 + (A1 - A0) * v;
    val.setAttribute('d', v > 0.002 ? arc(A0, a) : '');
    if (ptr) { const [x, y] = pt(a); ptr.setAttribute('x1', c + (x - c) * 0.35); ptr.setAttribute('y1', c + (y - c) * 0.35); ptr.setAttribute('x2', x); ptr.setAttribute('y2', y); }
    if (cls) k.className = 'knob ' + cls() + (k.classList.contains('drag') ? ' drag' : '');
    if (lbl) lbl.textContent = k.classList.contains('drag') ? fmt(v) : label;
    k.title = (name || label || '') + ' ' + fmt(v);
  };
  drag(k, dy => { set(Math.min(1, Math.max(0, get() + dy / 160))); }, draw);
  k.addEventListener('dblclick', () => reset && reset());
  k.draw = draw; draw();
  return k;
}

function paramKnob(key, label, size) {
  const k = knob({ size, label: size > 30 ? label : '', name: label, get: () => state.params[key], set: v => { state.params[key] = v; redraw(key); }, reset: () => { state.params[key] = label === 'Level' ? 0.75 : 0.5; redraw(key); } });
  (views[key] = views[key] || []).push(k.draw);
  return k;
}

function num({ label, get, set, min, max, per, text, small }) {
  const n = el('div', 'num' + (small ? ' small' : '')), v = el('span', 'v'), l = el('span', 'lbl', label);
  let acc = 0;
  const draw = () => { v.textContent = text ? text(get()) : get(); };
  n.append(...(small ? [l, v] : [v, l]));
  drag(n, dy => { acc += dy / per; const d = Math.trunc(acc); if (d) { acc -= d; set(Math.min(max, Math.max(min, get() + d))); draw(); } });
  n.draw = draw; draw();
  return n;
}

function segmented(host, options, get, set) {
  const draw = () => { host.innerHTML = ''; for (const [value, text] of options) { const b = el('button', get() === value ? 'is' : '', text); b.onclick = () => { set(value); draw(); }; host.append(b); } };
  draw(); return draw;
}

const laneName = ins => state.lanes[ins.id].alt ? ins.altName : ins.name;
const laneCode = ins => state.lanes[ins.id].alt ? ins.alt : ins.id;
const leds = {}, cells = {}, panelCells = [], nameRefresh = [];

function select(id) { state.sel = id; if (state.selStep && state.selStep.id !== id) state.selStep = null; refreshSelection(); renderSteps(); renderInspector(); }
function refreshSelection() {
  document.querySelectorAll('.col').forEach(c => c.classList.toggle('sel', c.dataset.id === state.sel));
  document.querySelectorAll('.lane[data-id]').forEach(c => c.classList.toggle('sel', c.dataset.id === state.sel));
  const ins = INS.find(i => i.id === state.sel); $('selName').textContent = laneCode(ins) + '  ' + laneName(ins);
}

function buildSound() {
  for (const ins of INS) {
    const col = el('div', 'col'); col.dataset.id = ins.id;
    const code = el('div', 'code'); col.append(code);
    for (const k of ins.knobs) col.append(paramKnob(ins.id + '.' + k, k, 46));
    if (ins.alt) { const p = el('div', 'pair'); segmented(p, [[false, ins.id], [true, ins.alt]], () => state.lanes[ins.id].alt, v => { state.lanes[ins.id].alt = v; nameRefresh.forEach(f => f()); refreshSelection(); renderInspector(); }); col.append(p); }
    const key = el('button', 'namekey'), led = el('span', 'led'), nm = el('span');
    key.append(led, nm); key.onclick = () => select(ins.id); col.append(key);
    (leds[ins.id] = leds[ins.id] || []).push(led);
    nameRefresh.push(() => { code.textContent = laneCode(ins); nm.textContent = laneName(ins); });
    $('sound').append(col);
  }
}

function stepCell(big) { const s = el('div', 'step'); s.append(el('div', 'fill')); return s; }
function paintCell(cell, id, i) {
  const lane = state.lanes[id], st = lane.steps[i], fill = cell.firstChild;
  cell.className = 'step b' + (Math.floor(i / 4) + 1) + (i >= lane.len ? ' off-len' : '') + (Object.keys(st.locks).length && st.on ? ' lock' : '') +
    (state.selStep && state.selStep.id === id && state.selStep.i === i ? ' sel' : '');
  fill.innerHTML = ''; cell.querySelector('.ev')?.remove();
  if (!st.on) return;
  const h = Math.max(12, Math.round(st.chance * 100)) + '%';
  if (st.flam) { const f = el('i', 'flam'); f.style.height = h; fill.append(f); }
  for (let n = 0; n < st.split; n++) { const s = el('i'); s.style.height = h; fill.append(s); }
  if (st.every > 1) cell.append(el('span', 'ev', '1:' + st.every));
}
function renderSteps() {
  panelCells.forEach((c, i) => paintCell(c, state.sel, i));
  for (const ins of INS) cells[ins.id].forEach((c, i) => paintCell(c, ins.id, i));
  if (state.playing) showPlayheads();
}
function wireCell(cell, getId, i) {
  cell.onclick = () => { const id = getId(), st = state.lanes[id].steps[i]; st.on = !st.on; state.selStep = st.on ? { id, i } : null; if (state.sel !== id) { state.sel = id; refreshSelection(); } renderSteps(); renderInspector(); };
  cell.oncontextmenu = e => { e.preventDefault(); const id = getId(); if (!state.lanes[id].steps[i].on) return; state.selStep = { id, i }; if (state.sel !== id) { state.sel = id; refreshSelection(); } renderSteps(); renderInspector(); };
}

function buildSeq() {
  for (let i = 0; i < 16; i++) { $('nums').append(el('span', '', i + 1)); const c = stepCell(); wireCell(c, () => state.sel, i); panelCells.push(c); $('panelSteps').append(c); }
  $('tempo').append(num({ label:'Tempo', get: () => state.tempo, set: v => { state.tempo = v; if (state.playing) { stop(); start(); } }, min:40, max:300, per:3, text: v => v.toFixed(1) }));
  const sh = knob({ size:46, label:'Shuffle', get: () => state.shuffle, set: v => { state.shuffle = v; sh.draw(); }, reset: () => { state.shuffle = 0; sh.draw(); } }); $('shuffle').append(sh);
  segmented($('variation'), [['A', 'A'], ['AB', 'AB'], ['B', 'B']], () => state.variation, v => state.variation = v);
  $('pattern').append(num({ label:'Pattern', get: () => state.pattern, set: v => state.pattern = v, min:1, max:12, per:10, text: v => String(v).padStart(2, '0'), small:true }));
  $('fill').onclick = () => { state.fill = !state.fill; $('fill').classList.toggle('is', state.fill); };
  const handleText = () => $('handle').textContent = $('plug').classList.contains('open') ? 'Close the lanes' : 'Open the lanes';
  $('handle').onclick = () => { $('plug').classList.toggle('open'); handleText(); fit(); }; handleText();
  $('play').onclick = () => state.playing ? stop() : start();
  $('lidTab').onclick = () => { $('lidTab').textContent = 'Under the Lid: next mockup'; setTimeout(() => $('lidTab').textContent = 'Under the Lid', 1600); };
}

function buildLanes() {
  for (const ins of INS) {
    const lane = state.lanes[ins.id], row = el('div', 'row3 lane'); row.dataset.id = ins.id;
    const head = el('div', 'lhead'), code = el('span', 'code'), led = el('span', 'led'), codeText = el('span'), nm = el('span', 'nm'), minis = el('span', 'minis'), ms = el('span', 'ms');
    code.append(led, codeText); (leds[ins.id] = leds[ins.id] || []).push(led);
    for (const k of ins.knobs) minis.append(paramKnob(ins.id + '.' + k, k, 22));
    for (const [prop, letter, title] of [['mute', 'M', 'Mute'], ['solo', 'S', 'Solo']]) {
      const b = el('button', '', letter); b.title = title;
      b.onclick = e => { e.stopPropagation(); lane[prop] = !lane[prop]; b.classList.toggle('is', lane[prop]); row.classList.toggle('muted', lane.mute); };
      ms.append(b);
    }
    head.append(code, nm, minis, ms); head.onclick = () => select(ins.id);
    nameRefresh.push(() => { codeText.textContent = laneCode(ins); nm.textContent = laneName(ins); });
    const steps = el('div', 'steps'); cells[ins.id] = [];
    for (let i = 0; i < 16; i++) { const c = stepCell(); wireCell(c, () => ins.id, i); cells[ins.id].push(c); steps.append(c); }
    const right = el('div', 'right');
    right.append(num({ label:'Len', get: () => lane.len, set: v => { lane.len = v; renderSteps(); }, min:1, max:16, per:8, small:true }),
                 num({ label:'Shf', get: () => lane.shf, set: v => lane.shf = v, min:0, max:100, per:2, small:true }));
    row.append(head, steps, right); $('laneRows').append(row);
  }
}

function renderInspector() {
  const host = $('insp'); host.innerHTML = '';
  const who = el('div', 'who'), ctl = el('div', 'ctl'), hint = el('div', 'hint', 'A line under a step means it holds its own knob value. Double-click a lock to clear it.');
  host.append(who, ctl, hint);
  if (!state.selStep) { who.innerHTML = 'No step selected<small>Switch a step on, or right-click one that is on</small>'; return; }
  const { id, i } = state.selStep, ins = INS.find(x => x.id === id), st = state.lanes[id].steps[i];
  who.innerHTML = `Step ${i + 1}<small>${laneName(ins)}</small>`;
  const grp = (label, ...kids) => { const g = el('div', 'grp'); g.append(el('span', 'lbl', label), ...kids); ctl.append(g); };
  grp('Chance', num({ label:'', get: () => Math.round(st.chance * 100), set: v => { st.chance = v / 100; renderSteps(); }, min:5, max:100, per:2, text: v => v + ' %', small:true }));
  const every = el('div', 'seg'); segmented(every, [[1, 'All'], [2, '1:2'], [3, '1:3'], [4, '1:4']], () => st.every, v => { st.every = v; renderSteps(); }); grp('Plays', every);
  const flam = el('button', 'chip' + (st.flam ? ' is' : ''), 'Flam'); flam.onclick = () => { st.flam = !st.flam; flam.classList.toggle('is', st.flam); renderSteps(); }; grp('', flam);
  const split = el('div', 'seg'); segmented(split, [[1, '1'], [2, '2'], [3, '3']], () => st.split, v => { st.split = v; renderSteps(); }); grp('Hits', split);
  const lockable = ins.knobs.filter(k => k !== 'Level');
  if (lockable.length) {
    const g = el('div', 'grp'); g.append(el('span', 'lbl', 'Locks'));
    for (const k of lockable) {
      const key = ins.id + '.' + k;
      const kn = knob({ size:34, label:k, get: () => st.locks[k] ?? state.params[key], set: v => { st.locks[k] = v; kn.draw(); renderSteps(); },
                        reset: () => { delete st.locks[k]; kn.draw(); renderSteps(); }, cls: () => k in st.locks ? 'locked' : 'unset' });
      g.append(kn);
    }
    ctl.append(g);
  }
}

function showPlayheads() {
  document.querySelectorAll('.step.play').forEach(c => c.classList.remove('play'));
  if (state.tick < 0) return;
  for (const ins of INS) { const pos = state.tick % state.lanes[ins.id].len; cells[ins.id][pos].classList.add('play'); if (ins.id === state.sel) panelCells[pos].classList.add('play'); }
}
function flash(id) { for (const l of leds[id]) { l.classList.add('on'); setTimeout(() => l.classList.remove('on'), 90); } }
function tick() {
  state.tick++;
  const anySolo = INS.some(i => state.lanes[i.id].solo);
  for (const ins of INS) {
    const lane = state.lanes[ins.id], pos = state.tick % lane.len, round = Math.floor(state.tick / lane.len), st = lane.steps[pos];
    if (st.on && !lane.mute && (!anySolo || lane.solo || ins.id === 'AC') && round % st.every === 0 && Math.random() < st.chance) flash(ins.id);
  }
  showPlayheads();
}
let timer = null;
function start() { state.playing = true; $('play').classList.add('is'); $('playIcon').setAttribute('d', 'M3 3 H15 V15 H3 Z'); tick(); timer = setInterval(tick, 60000 / state.tempo / 4); }
function stop() { state.playing = false; clearInterval(timer); state.tick = -1; $('play').classList.remove('is'); $('playIcon').setAttribute('d', 'M4 2 L16 9 L4 16 Z'); showPlayheads(); }

function fit() {
  const s = Math.min(1.35, (window.innerWidth - 32) / 1240);
  $('plug').style.transform = `scale(${s})`; $('holder').style.height = $('plug').offsetHeight * s + 'px';
}

for (const [id, name] of THEMES) {
  const b = el('button', id === 'studio' ? 'is' : '', name);
  b.onclick = () => { document.documentElement.dataset.theme = id; document.querySelectorAll('#themes button').forEach(x => x.classList.toggle('is', x === b)); };
  $('themes').append(b);
}
buildSound(); buildSeq(); buildLanes();
nameRefresh.forEach(f => f()); state.selStep = { id:'BD', i:10 };
refreshSelection(); renderSteps(); renderInspector(); fit();
window.addEventListener('resize', fit);
</script>
</body>
</html>
