<!doctype html>
<html lang="en" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoolSynth 808 - library mockup</title>
<style>
  /* The same colour roles as the panel's mockup (coolsynth-808.html). */
  [data-theme="studio"] {
    --desk:#171615; --panel:#2d2b28; --ink:#ece4d2; --dim:#9a927f; --line:#4a463f;
    --strip:#e8742a; --on:#e8742a; --on-ink:#1a1512; --lit:#ffc36b;
    --g1:#4b463e; --g2:#5b554b; --g3:#6c6558; --g4:#7e7666;
  }
  [data-theme="paper"] {
    --desk:#d8d1bf; --panel:#f3ecdb; --ink:#1d1c1a; --dim:#7b7566; --line:#c9c0aa;
    --strip:#c8372d; --on:#1d1c1a; --on-ink:#f3ecdb; --lit:#c8372d;
    --g1:#e6dec9; --g2:#dbd2bb; --g3:#cfc5ac; --g4:#c3b89d;
  }
  [data-theme="night"] {
    --desk:#000000; --panel:#101012; --ink:#c9c5bb; --dim:#6d6a63; --line:#2a2a2f;
    --strip:#ffb000; --on:#ffb000; --on-ink:#141000; --lit:#ffd266;
    --g1:#1b1b1f; --g2:#232329; --g3:#2c2c33; --g4:#35353e;
  }
  [data-theme="blueprint"] {
    --desk:#0b2444; --panel:#133d70; --ink:#eaf3ff; --dim:#8fb1dc; --line:#3d6aa6;
    --strip:#eaf3ff; --on:#eaf3ff; --on-ink:#133d70; --lit:#9fe3ff;
    --g1:#1b4b87; --g2:#235799; --g3:#2b63ab; --g4:#346fbd;
  }
  * { box-sizing:border-box; }
  html { font:13px/1.25 "Inter","Segoe UI","Helvetica Neue",Arial,sans-serif; }
  body { margin:0; background:var(--desk); color:var(--ink); }
  button, input { font:inherit; color:inherit; }
  button { background:none; border:0; padding:0; cursor:pointer; }

  .mock-bar { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:12px 16px; font-size:12px; color:var(--dim); }
  .pills { display:flex; gap:6px; flex-wrap:wrap; }
  .pills button { padding:5px 10px; border:1px solid var(--line); border-radius:999px; color:var(--ink); }
  .pills button.is { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  .about { padding:0 16px 12px; max-width:1240px; color:var(--dim); font-size:12px; line-height:1.5; }
  .about b { color:var(--ink); font-weight:600; }

  .holder { margin:0 16px 24px; overflow-x:auto; }
  .plug { width:1240px; min-height:720px; background:var(--panel); border:1px solid var(--line); border-radius:10px; position:relative; overflow:hidden; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; padding:18px 24px 12px; border-bottom:1px solid var(--line); }
  .word { font-size:27px; font-weight:300; }
  .word b { font-weight:800; letter-spacing:.03em; }
  .sub { margin-top:4px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  .chips { display:flex; gap:6px; }
  .chip { padding:6px 11px; border:1px solid var(--line); border-radius:6px; font-size:12px; }
  .chip.is { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  .btn { padding:7px 12px; border:1px solid var(--line); border-radius:6px; font-size:12px; white-space:nowrap; }
  .btn.main { background:var(--on); color:var(--on-ink); border-color:var(--on); font-weight:600; }
  .btn:hover { border-color:var(--ink); }
  select.btn { background:var(--panel); color:var(--ink); }
  .tag { display:inline-block; padding:2px 7px; border-radius:999px; border:1px solid var(--line); font-size:10.5px; color:var(--dim); }
  .tag.high { border-color:var(--ink); color:var(--ink); }
  .dim { color:var(--dim); }
  .small { font-size:11px; }
  .cap { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  .star { color:var(--dim); font-size:14px; }
  .star.on { color:var(--lit); }

  /* A beat as a grid: one row a lane, sixteen cells, beat groups shaded. */
  .grid { display:grid; grid-template-columns:28px repeat(16, 1fr); gap:3px; align-items:center; }
  .grid .lc { font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--dim); }
  .grid .c { height:16px; border-radius:3px; background:var(--g1); }
  .grid .c.q2 { background:var(--g2); } .grid .c.q3 { background:var(--g3); } .grid .c.q4 { background:var(--g4); }
  .grid .c.on { background:var(--ink); }
  .grid .c.acc { background:var(--on); }
  .grid .c.ph { outline:2px solid var(--lit); outline-offset:-1px; }
  .thumb { display:grid; grid-template-columns:repeat(16, 4px); gap:1px; }
  .thumb i { width:4px; height:2px; background:color-mix(in srgb, var(--ink) 14%, transparent); }
  .thumb i.on { background:var(--ink); }

  /* A: the shelf */
  .shelf { display:grid; grid-template-columns:230px 440px 1fr; height:640px; }
  .side { border-right:1px solid var(--line); padding:14px 12px; overflow:auto; }
  .search { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:transparent; margin-bottom:12px; }
  .side h4 { margin:14px 6px 6px; }
  .side button.row { display:flex; justify-content:space-between; width:100%; padding:5px 8px; border-radius:5px; text-align:left; }
  .side button.row:hover, .side button.row.is { background:color-mix(in srgb, var(--ink) 10%, transparent); }
  .side .decades { display:flex; gap:4px; flex-wrap:wrap; padding:0 6px; }
  .list { border-right:1px solid var(--line); overflow:auto; }
  .item { display:grid; grid-template-columns:20px 1fr 70px 70px; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid color-mix(in srgb, var(--line) 50%, transparent); cursor:pointer; }
  .item:hover { background:color-mix(in srgb, var(--ink) 5%, transparent); }
  .item.is { background:color-mix(in srgb, var(--ink) 11%, transparent); }
  .item .n { font-weight:600; }
  .detail { padding:18px 22px; overflow:auto; }
  .detail h2 { margin:4px 0 4px; font-size:20px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .note { margin-top:12px; line-height:1.5; color:var(--dim); max-width:520px; }
  .parts { display:flex; gap:6px; margin:10px 0; }

  /* B: the wall */
  .wall { padding:14px 18px 190px; overflow:auto; height:640px; }
  .wall table { border-collapse:separate; border-spacing:8px; }
  .wall th { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); font-weight:600; text-align:left; vertical-align:top; padding-top:8px; }
  .wall td { vertical-align:top; } .wall .cell { display:flex; flex-wrap:wrap; gap:6px; width:262px; }
  .tile { width:128px; padding:8px; border:1px solid var(--line); border-radius:7px; cursor:pointer; }
  .tile:hover { border-color:var(--ink); }
  .tile.is { background:var(--ink); color:var(--panel); }
  .tile.is .thumb i { background:color-mix(in srgb, var(--panel) 25%, transparent); }
  .tile.is .thumb i.on { background:var(--panel); }
  .tile .t { font-size:11px; font-weight:600; margin-top:6px; }
  .tile .y { font-size:10px; opacity:.7; }
  .drawer { position:absolute; left:0; right:0; bottom:0; height:180px; border-top:1px solid var(--line); background:var(--panel); display:grid; grid-template-columns:330px 1fr 260px; gap:20px; padding:14px 22px; }

  /* C: in the panel */
  .inpanel { padding:14px 24px; }
  .browse { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; }
  .browse .what { flex:1; display:flex; align-items:center; gap:12px; }
  .browse .big { font-size:17px; font-weight:700; }
  .arrow { width:34px; height:34px; border:1px solid var(--line); border-radius:50%; font-size:15px; }
  .lanes .grid { grid-template-columns:28px repeat(16, 1fr); }
  .lanes .grid .c { height:22px; }
  .ghost .c.on { background:transparent; outline:2px dashed var(--ink); outline-offset:-3px; }
  .ghost .c.acc { background:transparent; outline:2px dashed var(--on); outline-offset:-3px; }
  .legend { display:flex; gap:16px; margin:10px 0 0; font-size:11px; color:var(--dim); }
  .manage { position:absolute; right:24px; top:150px; width:330px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:12px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .manage .r { display:flex; justify-content:space-between; padding:6px 4px; border-bottom:1px solid color-mix(in srgb, var(--line) 50%, transparent); }
</style>
</head>
<body>
<div class="mock-bar">
  <div class="pills" id="dirs"></div>
  <div class="pills" id="themes"></div>
  <span>Mockup of the pattern library (to decide with you). The beats are the app's 56; "My patterns" here are made up.</span>
</div>
<div class="about" id="about"></div>
<div class="holder"><div class="plug" id="plug"></div></div>

  if (state.q && !(b.name + " " + b.after).toLowerCase().includes(state.q.toLowerCase())) return false;
  if (state.decade && Math.floor(b.year / 10) * 10 !== state.decade) return false;
  if (state.filter === "all") return !b.mine;
  if (state.filter === "fav") return favourites.has(b.id);
  if (state.filter.startsWith("folder:")) return b.mine && b.folder === state.filter.slice(7);
  if (state.filter === "mine") return b.mine;
  return !b.mine && familyOf(b) === state.filter;
}
const selected = () => ALL.find(b => b.id === state.sel) || ALL[0];

function detailHtml(b) {
  const parts = b.parts.length > 1 ? `<div class="parts">${b.parts.map((_, i) => `<button class="chip ${i === state.part ? "is" : ""}" data-part="${i}">Part ${i + 1}</button>`).join("")}</div>` : "";
  const halves = b.variations !== "A" ? `<div class="parts">${["A","B"].map(h => `<button class="chip ${h === state.half ? "is" : ""}" data-half="${h}">${h}</button>`).join("")}</div>` : "";
  const manage = b.mine
    ? `<button class="btn">Rename</button><button class="btn">Duplicate</button><button class="btn">Move to folder...</button><button class="btn">Recycle Bin</button>`
    : `<button class="btn">Copy to My patterns</button>`;
  return `<div class="cap">${b.mine ? "My patterns / " + b.folder : familyOf(b) + " / " + b.year}</div>
    <h2>${b.name} <button class="star ${favourites.has(b.id) ? "on" : ""}" data-fav="${b.id}" title="Favourite">&#9733;</button></h2>
    <div class="small dim">${b.after ? "After " + b.after : ""}</div>
    <div style="margin:10px 0" class="small">${b.bpm} BPM &middot; swing ${b.swing} % &middot; ${b.parts.length * (b.variations === "A" ? 1 : 2)} bar${b.parts.length * (b.variations === "A" ? 1 : 2) > 1 ? "s" : ""} &nbsp; ${conf(b.confidence)}</div>
    <div class="actions">
      <button class="btn" data-audition>${state.playing ? "&#9632; Stop audition" : "&#9654; Audition from the next bar"}</button>
      <button class="btn main">Load into pattern 03</button>
      ${b.parts.length > 1 ? `<button class="btn">Load as a chain of ${b.parts.length}</button>` : ""}
      ${manage}
    </div>
    ${parts}${halves}
    ${grid(b, state.part, state.half, state.step)}
    <div class="note">${b.notes || ""}</div>`;
}

function renderShelf() {
  const counts = f => ALL.filter(b => !b.mine && familyOf(b) === f).length;
  const folders = [...new Set(MINE.map(m => m.folder))];
  const row = (key, label, n) => `<button class="row ${state.filter === key ? "is" : ""}" data-filter="${key}"><span>${label}</span><span class="dim">${n}</span></button>`;
  const list = ALL.filter(matches).sort((a, b) => a.mine === b.mine ? a.year - b.year : 0);
  return head("Library") + `<div class="shelf">
    <div class="side">
      <input class="search" id="q" placeholder="Search names and records" value="${state.q}">
      ${row("fav", "&#9733; Favourites", favourites.size)}
      <h4 class="cap">My patterns</h4>
      ${row("mine", "All of mine", MINE.length)}
      ${folders.map(f => row("folder:" + f, "&nbsp;&nbsp;" + f, MINE.filter(m => m.folder === f).length)).join("")}
      <button class="row dim">+ New folder</button>
      <h4 class="cap">Classics</h4>
      ${row("all", "Every classic", BEATS.length)}
      ${FAMILIES.map(f => row(f[0], f[0], counts(f[0]))).join("")}
      <h4 class="cap">Decade</h4>
      <div class="decades">${[1960,1980,1990,2000,2010].map(d => `<button class="chip ${state.decade === d ? "is" : ""}" data-decade="${d}">${String(d).slice(2)}s</button>`).join("")}</div>
    </div>
    <div class="list">${list.map(b => `<div class="item ${b.id === state.sel ? "is" : ""}" data-sel="${b.id}">
        <span class="star ${favourites.has(b.id) ? "on" : ""}">&#9733;</span>
        <div><div class="n">${b.name}</div><div class="small dim">${b.mine ? b.folder : (b.after.split(",")[0] || "").slice(0, 46)}</div></div>
        ${thumb(b)}<span class="small dim" style="text-align:right">${b.bpm} BPM</span></div>`).join("") || '<div class="item dim">Nothing matches.</div>'}</div>
    <div class="detail">${detailHtml(selected())}</div></div>`;
}

function renderWall() {
  const decades = [1960, 1980, 1990, 2000, 2010];
  let t = `<table><tr><th></th>${decades.map(d => `<th>${d}s</th>`).join("")}</tr>`;
  t += `<tr><th>Yours</th><td colspan="5"><div class="cell" style="width:auto">${MINE.map(tile).join("")}<div class="tile dim" style="border-style:dashed"><div class="t">+ Keep pattern 03</div></div></div></td></tr>`;
  for (const f of FAMILIES) {
    t += `<tr><th style="width:110px">${f[0]}</th>`;
    for (const d of decades)
      t += `<td><div class="cell">${BEATS.filter(b => familyOf(b) === f[0] && Math.floor(b.year / 10) * 10 === d).sort((a, b) => a.year - b.year).map(tile).join("")}</div></td>`;
    t += "</tr>";
  }
  t += "</table>";
  const b = selected();
  return head("Library") + `<div class="wall">${t}</div>
    <div class="drawer">
      <div><div class="cap">${b.mine ? "Yours" : familyOf(b) + " / " + b.year}</div>
        <h2 style="margin:4px 0;font-size:18px">${b.name} <button class="star ${favourites.has(b.id) ? "on" : ""}" data-fav="${b.id}">&#9733;</button></h2>
        <div class="small dim">${(b.after || b.notes).slice(0, 150)}</div>
        <div class="small" style="margin-top:6px">${b.bpm} BPM &middot; swing ${b.swing} % ${conf(b.confidence)}</div></div>
      <div style="transform:scale(.55);transform-origin:top left;width:180%">${grid(b, 0, "A", state.step)}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn" data-audition>${state.playing ? "&#9632; Stop audition" : "&#9654; Audition"}</button>
        <button class="btn main">Load into pattern 03</button>
        <button class="btn">${b.mine ? "Rename, move, Recycle Bin..." : "Copy to Yours"}</button></div>
    </div>`;
  function tile(x) {
    return `<div class="tile ${x.id === state.sel ? "is" : ""}" data-sel="${x.id}">${thumb(x)}<div class="t">${x.name}</div><div class="y">${x.mine ? x.folder : x.bpm + " BPM"}</div></div>`;
  }
}

function renderInPanel() {
  const list = ALL.filter(b => state.filter === "mine" ? b.mine : !b.mine);
  const b = selected();
  const own = BEATS.find(x => x.id === "electro-1983") || BEATS[1];
  return head("") + `<div class="inpanel">
    <div class="browse">
      <button class="arrow" data-step="-1">&#9664;</button>
      <div class="what"><div><div class="cap">${b.mine ? "My patterns" : familyOf(b) + " / " + b.year} &middot; ${list.indexOf(b) + 1} of ${list.length}</div>
        <div class="big">${b.name} <button class="star ${favourites.has(b.id) ? "on" : ""}" data-fav="${b.id}">&#9733;</button></div>
        <div class="small dim">${(b.after.split(",")[0] || b.notes).slice(0, 90)}</div></div></div>
      <button class="arrow" data-step="1">&#9654;</button>
      <select class="btn" id="shelfPick"><option value="all" ${state.filter !== "mine" ? "selected" : ""}>Classics</option><option value="mine" ${state.filter === "mine" ? "selected" : ""}>My patterns</option></select>
      <button class="btn" data-audition>${state.playing ? "Back to my pattern" : "Hear it in place"}</button>
      <button class="btn main">Take it</button>
      <button class="btn" data-manage>Manage...</button>
    </div>
    <div class="cap" style="margin:0 0 6px">${state.playing ? "Playing the library beat in place of pattern 03 until you take it or go back" : "Pattern 03 as it is (solid) and the library beat over it (dashed)"}</div>
    <div class="lanes">${state.playing ? grid(b, 0, "A", state.step) : overlay(own, b)}</div>
    <div class="legend"><span>&#9664; &#9654; or the main knob: the next beat</span><span>Enter: take it</span><span>Esc: back to yours</span></div>
    ${state.manage ? `<div class="manage"><div class="cap" style="margin-bottom:6px">My patterns</div>
      ${MINE.map(m => `<div class="r"><span>${m.name} <span class="dim small">${m.folder}</span></span><span class="small dim">Rename &middot; Delete</span></div>`).join("")}
      <div class="actions"><button class="btn">Keep pattern 03 as...</button><button class="btn">Import...</button><button class="btn">Show the folder</button></div></div>` : ""}
  </div>`;
  function overlay(mine, lib) {
    // Solid: your pattern. Dashed: the library beat, where it differs.
    let h = '<div class="grid">';
    const p = mine.parts[0], q = lib.parts[0];
    for (const codes of LANES) {
      const r1 = laneRow(p, codes, "A"), r2 = laneRow(q, codes, "A");
      h += `<span class="lc">${codes[0]}</span>`;
      for (let s = 0; s < 16; s++) {
        const a = r1[s] === "x", c = r2[s] === "x";
        const cls = a ? (codes[0] === "AC" ? "acc" : "on") : "";
        const ghost = !a && c ? `style="outline:2px dashed ${codes[0] === "AC" ? "var(--on)" : "var(--ink)"};outline-offset:-3px"` : "";
        h += `<span class="c q${(s >> 2) + 1} ${cls}" ${ghost}></span>`;
      }
    }
    return h + "</div>";
  }
}

const DIRS = {
  shelf: ["A. The shelf", "<b>A. The shelf.</b> The library over the panel, as now, grown into a browser: a column of shelves (favourites, your own patterns in folders, the classics by family, decades), a list with a small picture of each beat, and the chosen beat in full on the right. Audition plays it in time from the next bar while your pattern waits; Load puts it in the pattern you are editing. Your own patterns get rename, duplicate, folders and the Recycle Bin. Like Kontakt's and XO's browsers: the most familiar, the most to manage."],
  wall: ["B. The wall", "<b>B. The wall.</b> Every beat as a tile on one wall: families down, decades across, your own patterns as the top row. It shows the history at a glance (where acid house sits beside electro, how trap grew out of the bass music) and invites wandering. A drawer at the bottom shows the chosen beat with Audition and Load. Management stays small: copy a classic to Yours, and rename, move or bin your own from the drawer."],
  inpanel: ["C. In the panel", "<b>C. In the panel.</b> No window over the panel: a browse line above the lanes, stepped through with the arrows or the controller's main knob, as a hardware machine's pattern select. The library beat shows dashed over your pattern; Hear it in place swaps it in at the next bar until you take it or go back. Fastest while playing and the most hardware-like; the least room to read about a beat. Your own patterns are managed in a small Manage list."],
};

function render() {
  document.getElementById("about").innerHTML = DIRS[state.dir][1];
  const plug = document.getElementById("plug");
  plug.innerHTML = state.dir === "shelf" ? renderShelf() : state.dir === "wall" ? renderWall() : renderInPanel();
  const q = document.getElementById("q");
  if (q) q.oninput = e => { state.q = e.target.value; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  const pick = document.getElementById("shelfPick");
  if (pick) pick.onchange = e => { state.filter = e.target.value; const l = ALL.filter(b => state.filter === "mine" ? b.mine : !b.mine); state.sel = l[0].id; render(); };
  document.getElementById("dirs").innerHTML = Object.entries(DIRS).map(([k, v]) => `<button class="${k === state.dir ? "is" : ""}" data-dir="${k}">${v[0]}</button>`).join("");
  const th = document.documentElement.dataset.theme;
  document.getElementById("themes").innerHTML = [["studio","Studio 1982"],["paper","Paper"],["night","Night"],["blueprint","Blueprint"]].map(([k, v]) => `<button class="${k === th ? "is" : ""}" data-theme-pick="${k}">${v}</button>`).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-dir],[data-theme-pick],[data-sel],[data-filter],[data-decade],[data-fav],[data-audition],[data-part],[data-half],[data-step],[data-manage]");
  if (!t) return;
  const d = t.dataset;
  if (d.dir) { state.dir = d.dir; state.playing = false; state.manage = false; }
  if (d.themePick) document.documentElement.dataset.theme = d.themePick;
  if (d.sel) { state.sel = d.sel; state.part = 0; state.half = "A"; }
  if (d.filter) { state.filter = d.filter; }
  if (d.decade) state.decade = state.decade === +d.decade ? null : +d.decade;
  if (d.fav) { e.stopPropagation(); favourites.has(d.fav) ? favourites.delete(d.fav) : favourites.add(d.fav); }
  if (d.audition !== undefined) state.playing = !state.playing;
  if (d.part) state.part = +d.part;
  if (d.half) state.half = d.half;
  if (d.manage !== undefined) state.manage = !state.manage;
  if (d.step) {
    const l = ALL.filter(b => state.filter === "mine" ? b.mine : !b.mine);
    const i = l.findIndex(b => b.id === state.sel);
    state.sel = l[(i + +d.step + l.length) % l.length].id;
  }
  render();
});
document.addEventListener("keydown", e => {
  if (state.dir !== "inpanel") return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") document.querySelector(`[data-step="${e.key === "ArrowRight" ? 1 : -1}"]`).click();
  if (e.key === "Escape") { state.playing = false; render(); }
});
// The playhead while auditioning, at the beat's tempo.
let last = 0, acc = 0;
function tick(now) {
  if (state.playing) {
    const b = selected();
    acc += (now - last) / 1000;
    const sixteenth = 15 / b.bpm;
    if (acc >= sixteenth) { acc %= sixteenth; state.step = (state.step + 1) % 16; render(); }
  } else if (state.step !== -1) { state.step = -1; render(); }
  last = now;
  requestAnimationFrame(tick);
}
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
