<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoolSynth 303 layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Three layouts for CoolSynth 303 to try (D296). Mockups only: a pattern runs and lights the panel and the circuit,
   no sound. The circuits are drawn by a generator in the spirit of the real one, not from the netlists. */
:root {
  --ink: #ece4d2; --dim: #a39b88; --on: #e8742a; --lit: #ffc36b; --flow: #ffa04a;
  --g1: #4b463e; --g2: #5b554b; --g3: #6c6558; --g4: #7e7666;
  --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --stencil: 'Big Shoulders Stencil Display', 'Archivo', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0a09; color: var(--ink); font-family: var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; }

/* The mockup's own bar, not part of any design */
#chrome { position: fixed; inset: 0 0 auto 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px;
  background: #050505; border-bottom: 1px solid #222; font: 500 12px/1 system-ui, sans-serif; color: #999; z-index: 50; }
#chrome b { color: #ddd; font-weight: 600; margin-right: 10px; }
#chrome .tab { white-space: nowrap; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; cursor: pointer; color: #bbb; }
#chrome .tab.is { background: #e8742a; border-color: #e8742a; color: #111; }
#chrome .sp { flex: 1; }
#chrome .note { color: #777; }
#viewport { position: fixed; inset: 44px 0 0 0; display: grid; place-items: center; }
#stage { width: 1280px; height: 800px; position: relative; transform-origin: center center; flex: none; }
.view { position: absolute; inset: 0; display: none; overflow: hidden; }
.view.is { display: block; }

/* Type: one family, two sizes, numbers in a mono */
.lbl { font-weight: 600; font-size: 10px; line-height: 1; font-stretch: 75%; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.t13 { font-weight: 650; font-size: 13px; line-height: 1; font-stretch: 87.5%; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
.num { font-family: var(--mono); font-weight: 500; font-size: 13px; color: var(--ink); }
.logo { font-weight: 500; font-size: 19px; letter-spacing: .01em; color: var(--ink); white-space: nowrap; }
.logo b { font-weight: 800; }
.logo .sub { display: block; margin-top: 4px; }

/* Keys: a raised plastic cap in a dark surround; a toggle carries a small lens that lights */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  height: 26px; padding: 0 10px; border: 0; border-radius: 4px; cursor: pointer;
  background: linear-gradient(#4c4842, #37342f 46%, #2c2a26 100%);
  box-shadow: 0 0 0 1px #0b0a09, inset 0 1px 0 rgba(255,255,255,.17), inset 0 -2px 0 rgba(0,0,0,.38), 0 2px 3px rgba(0,0,0,.55);
  font-weight: 650; font-size: 10px; font-stretch: 75%; letter-spacing: .09em; text-transform: uppercase; color: #f1ebde;
  text-shadow: 0 -1px 0 rgba(0,0,0,.6); }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(1px); box-shadow: 0 0 0 1px #0b0a09, inset 0 1px 3px rgba(0,0,0,.55), 0 1px 1px rgba(0,0,0,.5); }
.btn.tg::before { content: ''; display: block; flex: none; width: 6px; height: 6px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #6b4a33, #241710 72%); box-shadow: 0 0 0 1px rgba(0,0,0,.7), inset 0 0 1px #000; }
.btn.tg.is::before { background: radial-gradient(circle at 35% 30%, #fff3dc, #ffb45c 42%, #e8742a 78%); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 7px 1px rgba(255,150,60,.85); }
.btn.rec.is::before { background: radial-gradient(circle at 35% 30%, #ffe2d6, #ff6a45 45%, #c8321a 80%); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 8px 2px rgba(255,80,40,.9); }
.btn.hot { background: linear-gradient(#f5a066, #e8742a 50%, #c3581b); color: #1a120c; text-shadow: 0 1px 0 rgba(255,255,255,.22); }
.btn.sq { width: 26px; padding: 0; }
.seg { display: inline-flex; gap: 4px; }
.seg .btn.is { background: linear-gradient(#6a655c, #4f4b44 46%, #3e3b35); color: #fff; }

/* Knobs: a solid cap, a pointer, printed ticks */
.knob { display: inline-flex; flex-direction: column; align-items: center; gap: 5px; cursor: ns-resize; user-select: none; position: relative; }
.knob svg { display: block; overflow: visible; }
.knob .kval { font-family: var(--mono); font-size: 10px; color: var(--lit); margin-top: -2px; }
.knob.locked::after { content: ''; position: absolute; right: -2px; top: -2px; width: 6px; height: 6px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff3dc, #ffb45c 42%, #e8742a 78%); box-shadow: 0 0 6px 1px rgba(255,150,60,.8); }
.knob.moving .kcap { filter: drop-shadow(0 0 5px rgba(255,150,60,.55)); }

/* Slide switch, as hardware */
.slide { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
.slide .lbl { color: #8f8877; } .slide .lbl.lit { color: #f4efe4; }
.slide svg { display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }

/* Pattern row, chain, status */
.prow { display: flex; align-items: center; gap: 4px; flex: none; }
.slot { flex: none; position: relative; width: 30px; height: 26px; border-radius: 3px; cursor: pointer; display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; color: #b9b19f;
  background: linear-gradient(#3b3833, #2c2a26); box-shadow: 0 0 0 1px #0b0a09, inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.35), 0 2px 3px rgba(0,0,0,.5); }
.slot.has { background: linear-gradient(#4a4640, #34312d); color: #f1ebde; }
.slot.edit { box-shadow: 0 0 0 1px #0b0a09, 0 0 0 3px var(--ink), inset 0 1px 0 rgba(255,255,255,.12); }
.slot.play { background: radial-gradient(ellipse at 50% 35%, #ffc58a, #f08a3c 55%, #c95b1d); color: #2a1408; }
.slot.play .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(255,244,228,.9); border-radius: 0 0 0 3px; }
.slot.queued { animation: blink .5s steps(2) infinite; }
@keyframes blink { 0% { filter: brightness(1.6) sepia(1) hue-rotate(-20deg); } 50% { filter: none; } }
.status { font-family: var(--mono); font-size: 11px; color: #ddd5c3; white-space: nowrap; }
.status b { color: var(--ink); font-weight: 600; } .status .q { color: var(--lit); }
.chain { display: flex; align-items: center; gap: 3px; }
.cblk { position: relative; height: 24px; min-width: 40px; padding: 0 8px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 11px; color: #f1ebde; overflow: hidden;
  background: linear-gradient(#4a4640, #34312d); box-shadow: 0 0 0 1px #0b0a09, inset 0 1px 0 rgba(255,255,255,.12), 0 2px 3px rgba(0,0,0,.5); }
.cblk .x { color: #b9b19f; }
.cblk.cur { background: radial-gradient(ellipse at 50% 35%, #ffc58a, #f08a3c 55%, #c95b1d); color: #2a1408; }
.cblk.cur .x { color: #3a2010; }
.cblk.cur .prog { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,244,228,.28); z-index: 0; }
.cblk > span { position: relative; z-index: 1; }
.cblk.nxt { box-shadow: 0 0 0 1px #0b0a09, 0 0 0 2px var(--lit); }
.cadd { width: 24px; justify-content: center; min-width: 0; color: var(--dim); background: transparent !important; box-shadow: 0 0 0 1px #4a463f !important; }

/* Transpose keys: one octave, played from the mouse, the computer's keys or MIDI */
.tkeys { position: relative; height: 26px; display: flex; }
.tkeys .w { width: 15px; height: 26px; border-radius: 0 0 2px 2px; background: linear-gradient(#e9e3d6, #bdb6a6); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25), 0 0 0 1px #0b0a09; cursor: pointer; }
.tkeys .b { position: absolute; top: 0; width: 10px; height: 16px; border-radius: 0 0 2px 2px; background: linear-gradient(#3b3833, #151412); box-shadow: 0 0 0 1px #000; cursor: pointer; z-index: 1; }
.tkeys .is { background: radial-gradient(ellipse at 50% 30%, #ffd9b0, #f08a3c 60%, #c95b1d) !important; }

/* The grid: lanes under one row of step lights */
.grid { display: grid; grid-template-columns: 74px 1fr; row-gap: 5px; align-content: start; user-select: none; }
.grid .rl { display: flex; align-items: center; gap: 4px; padding-left: 2px; }
.grid .rl .lbl { color: #ddd5c3; }
.cols16 { display: grid; grid-template-columns: repeat(16, 1fr); column-gap: 4px; }
.cols16 > *:nth-child(4n+1) { margin-left: 3px; }
.lamp { display: flex; align-items: center; justify-content: center; gap: 4px; height: 14px; }
.lamp i { width: 5px; height: 5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5a3e2a, #1d130c 72%); box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.lamp span { font-family: var(--mono); font-size: 9px; color: #8f8877; }
.lamp.cur i { background: radial-gradient(circle at 40% 35%, #ffffff, #ffc2b4 22%, #ff4528 52%, #e8200f 85%);
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 5px 2px #ff4a2a, 0 0 14px 7px rgba(255,50,30,.75); }
.lamp.cur span { color: #f4efe4; }
/* the pitch lane: one octave up the column, the note a cap at its height */
.pcol { position: relative; border-radius: 3px; cursor: ns-resize;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 calc(100%/13), rgba(0,0,0,.12) calc(100%/13) calc(200%/13));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.pcol.pick { box-shadow: inset 0 0 0 2px var(--ink); }
.pcol.off { opacity: .35; }
.pcol .cap { position: absolute; left: 3px; right: 3px; height: calc(100%/13 + 2px); border-radius: 3px;
  background: linear-gradient(#f5a066, #e8742a 50%, #c3581b); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(90,30,0,.45), 0 1px 2px rgba(0,0,0,.6); }
.pcol.acc .cap { background: linear-gradient(#ffc08e, #f59346 50%, #d86a28); box-shadow: inset 0 1px 0 #fff, 0 0 0 1px #ffd9b0, 0 1px 2px rgba(0,0,0,.6); }
.pcol.tie .cap { left: -6px; border-top-left-radius: 0; border-bottom-left-radius: 0; opacity: .8; }
.pcol.rest .cap { display: none; }
.pcol.ph .cap { background: radial-gradient(ellipse at 50% 35%, #fff0dc, #ffb067 55%, #e8742a); box-shadow: inset 0 1px 0 #fff, 0 0 14px rgba(255,160,70,.85); }
.pcol .nn { position: absolute; left: 0; right: 0; top: 3px; text-align: center; font-family: var(--mono); font-size: 10px; color: #f1ebde; pointer-events: none; }
.pcol .nn sup { font-size: 8px; color: var(--lit); }
.pcol .lk { position: absolute; right: 3px; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: #ffb45c; box-shadow: 0 0 5px #ff9a3a; display: none; }
.pcol.locked .lk { display: block; }
.pcol .sl { position: absolute; top: 50%; right: -7px; width: 10px; height: 2px; background: var(--lit); display: none; box-shadow: 0 0 4px var(--flow); }
.pcol.slide .sl { display: block; }
/* the rows of keys under it */
.skey { position: relative; height: 22px; border-radius: 3px; cursor: pointer; display: grid; place-items: center;
  font-family: var(--mono); font-size: 10px; color: #b9b19f;
  background: var(--g); box-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -2px 0 rgba(0,0,0,.25), 0 1px 0 rgba(0,0,0,.6); }
.skey.off { opacity: .35; }
.skey.on { background: linear-gradient(#f5a066, #e8742a 50%, #c3581b); color: #1a120c;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(90,30,0,.45), 0 1px 0 rgba(0,0,0,.6); }
.skey.lens::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6b4a33, #241710 72%); box-shadow: 0 0 0 1px rgba(0,0,0,.7); }
.skey.lens.on { background: var(--g); color: #b9b19f; }
.skey.lens.on::before { background: radial-gradient(circle at 35% 30%, #fff3dc, #ffb45c 42%, #e8742a 78%); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 7px 1px rgba(255,150,60,.85); }
.skey.txt.on { background: color-mix(in srgb, var(--g) 70%, #ece4d2); color: #1a1714; }
.g1 { --g: var(--g1); } .g2 { --g: var(--g2); } .g3 { --g: var(--g3); } .g4 { --g: var(--g4); }
/* motion: a knob's moves over the pattern, a bar a step */
.mcol { position: relative; border-radius: 2px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); cursor: crosshair; }
.mcol i { position: absolute; left: 2px; right: 2px; bottom: 2px; border-radius: 2px; background: linear-gradient(#ffcf9a, #e8742a); opacity: .85; }
.mcol.ph i { background: linear-gradient(#fff3e0, #ffb067); box-shadow: 0 0 10px rgba(255,160,70,.7); }

/* Tools on the right: the picked step, its locks */
.side { border-radius: 4px; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 4px 14px 10px; display: flex; flex-direction: column; overflow: hidden; }
.tsec { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 8px; }
.tsec:last-child { border-bottom: 0; }
.tsec .head { color: #f4efe4; }
.trow { display: flex; align-items: center; gap: 6px; }
.trow > .lbl { width: 46px; color: #cfc7b3; }
.tknobs { display: flex; gap: 12px; flex-wrap: wrap; }
.thint { line-height: 1.45; color: #b9b19f !important; text-transform: none; letter-spacing: .02em; font-size: 11px; }
.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.toolbar .sepv { width: 1px; height: 18px; background: rgba(255,255,255,.1); margin: 0 3px; }
.valbox { min-width: 64px; height: 26px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; border-radius: 3px;
  background: #0d0c0b; box-shadow: inset 0 1px 2px #000, 0 0 0 1px #3d3a35; font-family: var(--mono); font-size: 11px; color: var(--lit); cursor: pointer; }

/* Smoked glass, as the 808 app's */
.glass { position: absolute; border-radius: 6px; padding: 10px 14px;
  background: linear-gradient(170deg, rgba(255,255,255,.05), rgba(255,255,255,0) 30%), linear-gradient(rgba(16,15,13,.82), rgba(12,11,10,.88));
  backdrop-filter: blur(1.5px); box-shadow: inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.05), 0 3px 12px rgba(0,0,0,.6); }
.tstrip { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 5px;
  background: linear-gradient(rgba(16,15,13,.85), rgba(12,11,10,.9)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.5); }
.tstrip .tempo { display: flex; align-items: baseline; gap: 5px; padding: 0 6px; }
.tstrip .tempo .num { color: var(--lit); text-shadow: 0 0 6px rgba(255,160,74,.45); }
.tstrip .tsep { width: 1px; height: 20px; background: rgba(255,255,255,.1); margin: 0 3px; }
.tstrip .swing { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
.tstrip .swing .lbl { color: #f4efe4; }

/* The Mods panel: the Devil Fish's controls and the trimmers, closed by default */
.mods { position: absolute; z-index: 20; border-radius: 6px; padding: 12px 16px; display: none; gap: 18px;
  background: linear-gradient(rgba(24,22,20,.97), rgba(16,15,13,.98)); box-shadow: 0 12px 30px rgba(0,0,0,.65), inset 0 0 0 1px #4a463f; }
.mods.open { display: flex; }
.mods .mgrp { display: flex; flex-direction: column; gap: 10px; }
.mods .mknobs { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.mods .mhead { color: #f4efe4; }
.mods .mnote { color: #b9b19f; text-transform: none; letter-spacing: .02em; font-size: 11px; line-height: 1.4; max-width: 260px; }

/* Pop-ups */
.pop { position: absolute; z-index: 40; min-width: 180px; padding: 10px; border-radius: 5px; display: flex; flex-direction: column; gap: 6px;
  background: rgba(30,28,25,.97); box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 1px #4a463f; }
.pop .item { justify-content: start; width: 100%; background: transparent; box-shadow: none; }
.pop .item:hover { background: #3a3733; }

canvas.board { display: block; position: absolute; }

/* ===================== 1: the etched board ===================== */
#v1 { background:
    radial-gradient(1200px 400px at 30% 0%, rgba(255,255,255,.05), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, rgba(0,0,0,.02) 1px 3px),
    linear-gradient(#2c2a27, #23211e); }
#v1 > canvas.board { inset: 0; width: 100%; height: 100%; }
#v1 .kn { position: absolute; }
#v1 .kn .kcap { filter: drop-shadow(0 2px 2px rgba(0,0,0,.7)); }
#v1 .kn .lbl { color: #f4efe4; }
#v1 .secLabel { position: absolute; text-align: center; }
#v1 .secLabel .t13 { color: #f7f2e8; }
#v1 .secLabel .lbl { color: #e3dccb; margin-top: 3px; }
#v1 .secLabel.live .t13 { color: var(--lit); text-shadow: 0 0 8px rgba(255,160,74,.6); }
#v1 .glass { left: 14px; right: 14px; top: 330px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
#v1 .row { display: flex; align-items: center; gap: 10px; }
#v1 .main { flex: 1; display: grid; grid-template-columns: 1fr 236px; column-gap: 14px; min-height: 0; }
#v1 .mods { right: 18px; top: 52px; }

/* ===================== 2: TAL-Vocoder's charcoal ===================== */
#v2 { background: #26272a; }
#v2 .bar { position: absolute; left: 0; right: 0; top: 0; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 60px;
  background: #1c1d1f; border-bottom: 1px solid #111; }
#v2 .preset { display: flex; align-items: center; gap: 6px; }
#v2 .preset .name { min-width: 210px; height: 26px; display: grid; place-items: center; border-radius: 3px; background: #111214; box-shadow: inset 0 0 0 1px #3a3b3f; font-size: 12px; color: #e6e6e6; letter-spacing: .03em; }
#v2 .stencil { position: absolute; left: 0; top: 42px; bottom: 0; width: 52px; display: flex; align-items: center; justify-content: center; background: #1f2023; border-right: 1px solid #111; }
#v2 .stencil span { transform: rotate(-90deg); white-space: nowrap; font-family: var(--stencil); font-weight: 800; font-size: 40px; letter-spacing: .08em; color: #d9d9d6; }
#v2 .stencil span em { font-style: normal; color: #e8742a; }
#v2 .sect { position: absolute; border: 1px solid #6b6d72; border-radius: 9px; padding: 22px 12px 10px; }
#v2 .sect > .cap { position: absolute; left: 10px; top: -1px; transform: translateY(-50%); padding: 0 6px; background: #26272a;
  font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #e9e9e6; }
#v2 .arrow { position: absolute; width: 14px; height: 14px; color: #8d8f94; display: grid; place-items: center; font-size: 13px; }
#v2 .lbl { color: #bfc0c3; }
#v2 .knob .lbl { color: #d7d8da; }
#v2 .face .knob { gap: 14px; } /* room for the range's 0 and 10 above the name */
#v2 .foot { position: absolute; right: 16px; bottom: 6px; font-size: 10px; letter-spacing: .06em; color: #75777c; }
#v2 .tbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; height: 24px; min-width: 34px; padding: 0 8px; margin-top: 8px; border: 0; border-radius: 2px; cursor: pointer;
  background: #c9cacc; color: #1b1c1e; font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 1px 0 #000; }
#v2 .tbtn::before { content: ''; position: absolute; top: -8px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #4a1c17; }
#v2 .tbtn.is { background: #e8742a; color: #1a120c; }
#v2 .tbtn.is::before { background: #ff3b28; box-shadow: 0 0 6px 1px rgba(255,60,40,.8); }
#v2 .tbtn.plain::before { display: none; }
#v2 .tbtn.plain { margin-top: 0; }
#v2 .fader { display: flex; flex-direction: column; align-items: center; gap: 6px; user-select: none; cursor: ns-resize; }
#v2 .fader .trk { position: relative; width: 26px; height: 112px;
  background: repeating-linear-gradient(0deg, transparent 0 10px, #4b4d52 10px 11px), linear-gradient(90deg, transparent 11px, #0e0f10 11px 15px, transparent 15px); }
#v2 .fader .capf { position: absolute; left: 1px; width: 24px; height: 14px; border-radius: 2px; background: linear-gradient(#3b3c40, #16171a); box-shadow: 0 2px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
#v2 .fader .capf::after { content: ''; position: absolute; left: 3px; right: 3px; top: 6px; height: 2px; background: #e8742a; }

<script>
'use strict';
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };

// ---------------------------------------------------------------- the patterns
const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B', 'C'];
const SCALES = { Minor: [0, 2, 3, 5, 7, 8, 10, 12], Phrygian: [0, 1, 3, 5, 7, 8, 10, 12], Dorian: [0, 2, 3, 5, 7, 9, 10, 12], Chromatic: [...Array(13).keys()] };
const LOCKABLE = [['cutoff', 'Cutoff'], ['envmod', 'Env mod'], ['decay', 'Decay'], ['accent', 'Accent']];
const MOTIONABLE = [['cutoff', 'Cutoff'], ['res', 'Resonance'], ['envmod', 'Env mod'], ['decay', 'Decay'], ['accent', 'Accent']];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function blankStep() { return { n: 0, o: 0, a: false, s: false, g: 'rest', lock: {} }; }
// An acid line in a scale: mostly notes, some rests and ties, the root weighted, a few accents and slides. Drawn by
// the generator, so no line from a record is copied.
function generate(R, scale, root, into) {
  const sc = SCALES[scale], steps = [];
  for (let i = 0; i < 16; i++) {
    const r = R(), g = i === 0 ? 'note' : r < .68 ? 'note' : r < .84 ? 'rest' : 'tie';
    const deg = R() < .35 ? 0 : sc[Math.floor(R() * sc.length)];
    const o = R() < .16 ? 1 : R() < .12 ? -1 : 0;
    steps.push({ n: (deg + root) % 12, o, a: g === 'note' && R() < .27, s: g !== 'rest' && R() < .2, g, lock: {} });
  }
  if (into) into.steps = steps;
  return steps;
}
function newPattern(name, seed) {
  const p = { name, len: 16, steps: generate(rng(seed), 'Minor', 0), motion: {} };
  return p;
}
const bank = [newPattern('Line 1', 11), newPattern('Line 2', 23), newPattern('Line 3', 37), newPattern('Line 4', 52), newPattern('Line 5', 71)];
bank[0].motion.cutoff = [...Array(16)].map((_, i) => .25 + .5 * (.5 - .5 * Math.cos(i / 15 * Math.PI)));
bank[0].steps[6].lock = { decay: .15 }; bank[0].steps[12].lock = { cutoff: .85, accent: .9 };
while (bank.length < 16) bank.push(null);

const S = {
  playing: false, bpm: 128, swing: .52, step: -1, count: 0,
  editing: 0, hearing: 0, queued: null, chain: [{ p: 0, r: 2 }, { p: 1, r: 1 }, { p: 0, r: 2 }, { p: 2, r: 1 }], chainPos: 0, repLeft: 2, chainOn: true,
  loop: true, variation: 'A', pick: 4, cursor: 0, transpose: 0, rec: false, mods: false, entryOct: 0, transposeMode: false,
  scale: 'Minor', root: 0, mut: { pitch: true, accent: true, slide: true, rest: false }, motionKnob: 'cutoff',
  k: { tuning: .5, cutoff: .42, res: .72, envmod: .55, decay: .48, accent: .62, volume: .78, wave: 0,
    driveOn: true, drive: .35, tone: .55, delayOn: true, time: .4, fb: .38, mix: .22,
    overdrive: 0, ndecay: .5, adecay: .2, soft: 0, slidet: .3, track: 0, ffm: 0, sweep: 0, muffler: 0, tm3: .35, tm4: .57, tm5: .74, c11: .5 },
};
const undo = [], redo = [];
function shown() { return bank[S.editing] || (bank[S.editing] = { name: '', len: 16, steps: [...Array(16)].map(blankStep), motion: {} }); }
function heard() { return bank[S.hearing] || bank[0]; }
function snapshot() { undo.push(JSON.stringify({ i: S.editing, p: shown() })); if (undo.length > 100) undo.shift(); redo.length = 0; }
function restore(from, to) { const x = from.pop(); if (!x) return; const o = JSON.parse(x); to.push(JSON.stringify({ i: o.i, p: bank[o.i] })); bank[o.i] = o.p; S.editing = o.i; paintAll(); }

// ---------------------------------------------------------------- the clock and the sound's stand-ins
let noteT = -1e9, noteAcc = false, gateOn = false, slideOn = false, echoT = [];
let acc = 0;
function stepMs() { return 60000 / S.bpm / 4; }
function eff(key) {
  // a knob's value now: the step's lock, else the pattern's motion, else the knob
  const p = heard(), i = S.step >= 0 ? S.count % p.len : -1;
  if (S.playing && i >= 0) {
    if (p.steps[i].lock[key] !== undefined) return p.steps[i].lock[key];
    if (p.motion[key] && p.motion[key][i] !== null && p.motion[key][i] !== undefined) return p.motion[key][i];
  }
  return S.k[key];
}
function advance(now) {
  S.step = (S.step + 1) % 16; S.count++;
  if (S.step === 0) barLine();
  const p = heard(), i = S.count % p.len, st = p.steps[i];
  if (st.g === 'note') { noteT = now; noteAcc = st.a; gateOn = true; if (S.k.delayOn) echoT = [now + stepMs() * 3 * (1 + S.k.time)]; }
  else if (st.g === 'rest') gateOn = false;
  slideOn = st.s;
  paintAll();
}
function barLine() {
  if (S.queued !== null) { S.hearing = S.queued; S.queued = null; S.chainOn = false; return; }
  if (S.chainOn && S.chain.length) {
    if (S.count > 0) {
      S.repLeft--;
      if (S.repLeft <= 0) {
        if (!S.loop && S.chainPos === S.chain.length - 1) { S.chainPos = 0; S.repLeft = S.chain[0].r; setPlaying(false); return; }
        S.chainPos = (S.chainPos + 1) % S.chain.length; S.repLeft = S.chain[S.chainPos].r;
      }
    }
    S.hearing = S.chain[S.chainPos].p;
  }
}
function setPlaying(on) {
  S.playing = on;
  if (on) { S.step = -1; S.count = -1; acc = stepMs(); S.chainPos = 0; S.repLeft = S.chain[0] ? S.chain[0].r : 1; }
  else gateOn = false;
  paintAll();
}
// The envelope's and the VCA's level now, for the lights
function envNow(now) {
  const dt = now - noteT; if (dt < 0) return 0;
  const decay = noteAcc ? 200 : 200 + eff('decay') * 2300;
  return (noteAcc ? 1 : .72) * Math.exp(-dt / decay) * Math.min(1, dt / 4);
}
function vcaNow(now) { return (gateOn || slideOn) ? Math.max(.25, envNow(now) * 1.1) * (.6 + .4 * S.k.volume) : envNow(now) * .3; }

// ---------------------------------------------------------------- pieces of panel
const knobs = [];
function knobSVG(v, size, accent, style) {
  const r = size / 2, cx = r, cy = r, a0 = -150, a1 = 150, ticks = [];
  for (let i = 0; i <= 10; i++) {
    const a = (a0 + (a1 - a0) * i / 10 - 90) * Math.PI / 180, r1 = r + 3, r2 = r + (i % 5 === 0 ? 7 : 5);
    ticks.push(`<line x1="${cx + r1 * Math.cos(a)}" y1="${cy + r1 * Math.sin(a)}" x2="${cx + r2 * Math.cos(a)}" y2="${cy + r2 * Math.sin(a)}" style="stroke:var(--tick,#cfc7b3)" stroke-width="1.1"/>`);
  }
  let ends = '';
  if (style === 'tal') {
    const ae = a => (a - 90) * Math.PI / 180, rr = r + 13;
    ends = `<text x="${cx + rr * Math.cos(ae(a0))}" y="${cy + rr * Math.sin(ae(a0)) + 3}" font-size="8" fill="#8d8f94" text-anchor="middle" font-family="IBM Plex Mono">0</text>
            <text x="${cx + rr * Math.cos(ae(a1))}" y="${cy + rr * Math.sin(ae(a1)) + 3}" font-size="8" fill="#8d8f94" text-anchor="middle" font-family="IBM Plex Mono">10</text>`;
  }
  const a = (a0 + (a1 - a0) * v - 90) * Math.PI / 180, id = 'k' + Math.random().toString(36).slice(2, 8);
  const capA = style === 'tal' ? '#2a2b2e' : accent ? 'var(--acc-a,#f3a066)' : 'var(--knob-a,#4d4943)';
  const capB = style === 'tal' ? '#0c0c0d' : accent ? 'var(--acc-b,#b9541a)' : 'var(--knob-b,#1d1b18)';
  const ptr = style === 'tal' ? '#e8742a' : accent ? 'var(--acc-pointer,#1a1714)' : 'var(--pointer,#ece4d2)';
  return `<svg class="kcap" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><radialGradient id="${id}" cx="40%" cy="30%" r="80%"><stop offset="0" style="stop-color:${capA}"/><stop offset="1" style="stop-color:${capB}"/></radialGradient></defs>
    ${ticks.join('')}${ends}
    <circle cx="${cx}" cy="${cy + 1.5}" r="${r - 1}" fill="#000" opacity=".55"/>
    <circle cx="${cx}" cy="${cy}" r="${r - 1}" fill="url(#${id})" stroke="#0e0d0c" stroke-width="1"/>
    <circle cx="${cx}" cy="${cy}" r="${r * .62}" fill="none" stroke="rgba(255,255,255,.07)"/>
    <line x1="${cx + r * .2 * Math.cos(a)}" y1="${cy + r * .2 * Math.sin(a)}" x2="${cx + (r - 4) * Math.cos(a)}" y2="${cy + (r - 4) * Math.sin(a)}" style="stroke:${ptr}" stroke-width="2.4" stroke-linecap="round"/>
  </svg>`;
}
// A knob bound to S.k[key]: it shows the value the pattern plays (its motion, a step's lock) while it runs.
function knob(label, key, size = 40, opts = {}) {
  const k = el('div', 'knob' + (opts.cls ? ' ' + opts.cls : ''));
  const get = () => opts.lockStep !== undefined ? (shown().steps[opts.lockStep()].lock[key] ?? S.k[key]) : (opts.live === false ? S.k[key] : eff(key));

    if ($('v3').classList.contains('is')) playKey(KEYMAP[e.code]); else { S.transpose = KEYMAP[e.code]; paintAll(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); restore(e.shiftKey ? redo : undo, e.shiftKey ? undo : redo); }
});
paintAll();
let prev = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(250, t - prev); prev = t;
  if (S.playing) { acc += dt; const sm = stepMs(); while (acc >= sm) { acc -= sm; advance(t); } }
  for (const b of boards) { try { b.frame(t); } catch (e) { console.error(e); } }
}
requestAnimationFrame(loop);
</script>
